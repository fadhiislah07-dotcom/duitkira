<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Duit Kira — Student Money Tracker</title>
<meta name="description" content="A simple, private money tracker for Malaysian university students. Track PTPTN, budgets and daily spending — all stored on your own device." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>">
<style>
/* ============================================
   Duit Kira — Student Money Tracker
   Design tokens
   ============================================ */
:root {
  --navy: #172B4D;
  --baby-blue: #A9D6F5;
  --cream: #F5EBDD;
  --off-white: #FAF9F6;
  --soft-blue: #6FA8C9;
  --pale-blue: #DCEFFA;
  --dark-text: #202A36;
  --muted-grey: #7B8490;

  --income: #6FA787;
  --income-bg: #E7F1EA;
  --expense: #C97A6D;
  --expense-bg: #F6E9E6;
  --warning: #C79A4B;
  --warning-bg: #F6EEDD;
  --info: #6FA8C9;
  --info-bg: #E4F1F8;

  --bg: var(--off-white);
  --surface: #FFFFFF;
  --surface-2: var(--pale-blue);
  --text: var(--dark-text);
  --text-muted: var(--muted-grey);
  --border: rgba(23, 43, 77, 0.10);
  --shadow: 0 4px 16px rgba(23, 43, 77, 0.07);
  --shadow-lift: 0 10px 30px rgba(23, 43, 77, 0.14);

  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 22px;

  --sidebar-w: 232px;
  --topbar-h: 68px;
  --bottom-nav-h: 64px;

  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body.dark-mode {
  --bg: #111827;
  --surface: #1E293B;
  --surface-2: #263449;
  --text: #F8FAFC;
  --text-muted: #A8B1BC;
  --border: rgba(248, 250, 252, 0.10);
  --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  --shadow-lift: 0 12px 34px rgba(0, 0, 0, 0.45);
  --navy: #A9D6F5;
  --baby-blue: #7DBCE3;
  --income-bg: #1C332A;
  --expense-bg: #34221F;
  --warning-bg: #332B18;
  --info-bg: #1B2C38;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }

h1, h2, h3, h4 { margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0 0 8px; }
button { font-family: inherit; }
a { color: inherit; }

::selection { background: var(--baby-blue); color: var(--navy); }

/* ============================================
   App shell / layout
   ============================================ */
#app {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--navy);
  color: #EAF2FB;
  display: flex;
  flex-direction: column;
  padding: 22px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
}
body.dark-mode .sidebar { background: #0B1220; }

.sidebar__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 10px 26px;
  font-weight: 800;
  font-size: 19px;
}
.sidebar__coin { font-size: 22px; }

.sidebar__nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }

.navlink {
  display: flex;
  align-items: center;
  gap: 12px;
  border: none;
  background: transparent;
  color: rgba(234, 242, 251, 0.78);
  padding: 11px 12px;
  border-radius: var(--radius-sm);
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s ease, color 0.15s ease;
}
.navlink:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
.navlink[aria-current="page"] { background: var(--baby-blue); color: var(--navy); }
.navlink__icon { font-size: 17px; width: 20px; text-align: center; }

.sidebar__darkmode {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  color: #EAF2FB;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 600;
  margin-top: 12px;
}
.sidebar__darkmode:hover { background: rgba(255, 255, 255, 0.12); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 5;
  border-bottom: 1px solid var(--border);
}
.topbar__title { font-size: 21px; }
.topbar__right { display: flex; align-items: center; gap: 12px; }

.semester-select { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
.semester-select select {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.page-content {
  padding: 24px 28px 100px;
  max-width: 1240px;
  outline: none;
}

/* ============================================
   Cards & grids
   ============================================ */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.card--cream { background: var(--cream); border-color: transparent; }
body.dark-mode .card--cream { background: var(--surface-2); }

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}

.stat-card { display: flex; flex-direction: column; gap: 6px; }
.stat-card__label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
.stat-card__value { font-size: 24px; font-weight: 800; color: var(--text); }
.stat-card__value--income { color: var(--income); }
.stat-card__value--expense { color: var(--expense); }
.stat-card__sub { font-size: 12px; color: var(--text-muted); }

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 26px 0 12px;
}
.section-title h2 { font-size: 17px; }
.section-title:first-child { margin-top: 0; }

.two-col {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 16px;
}
.chart-card { min-height: 300px; }
.chart-card__canvas-wrap { position: relative; height: 260px; margin-top: 10px; }

/* ============================================
   Buttons
   ============================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: none;
  border-radius: var(--radius-sm);
  padding: 11px 18px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.15s ease, opacity 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn--primary { background: var(--navy); color: #fff; }
.btn--primary:hover { box-shadow: 0 6px 16px rgba(23,43,77,0.25); }
.btn--secondary { background: var(--baby-blue); color: var(--navy); }
.btn--soft { background: var(--pale-blue); color: var(--navy); }
.btn--ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn--danger { background: var(--expense); color: #fff; }
.btn--sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.btn--block { width: 100%; }
.btn--icon { padding: 8px; border-radius: 8px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }

/* ============================================
   Forms
   ============================================ */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.form-field--full { grid-column: 1 / -1; }
.form-field label { font-size: 12.5px; font-weight: 700; color: var(--text-muted); }
.form-field input,
.form-field select,
.form-field textarea {
  border: 1.5px solid var(--border);
  background: var(--pale-blue);
  color: var(--text);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 14.5px;
  font-family: inherit;
  width: 100%;
}
body.dark-mode .form-field input,
body.dark-mode .form-field select,
body.dark-mode .form-field textarea {
  background: var(--surface-2);
}
.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus {
  outline: 2px solid var(--soft-blue);
  outline-offset: 1px;
}
.form-field textarea { resize: vertical; min-height: 60px; }
.form-error { color: var(--expense); font-size: 12px; min-height: 15px; }
.form-hint { font-size: 12px; color: var(--text-muted); }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

fieldset { border: none; padding: 0; margin: 0; }
.type-toggle { display: flex; gap: 8px; margin-bottom: 6px; }
.type-toggle button {
  flex: 1;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  padding: 10px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  cursor: pointer;
}
.type-toggle button.is-active.type-expense { background: var(--expense-bg); color: var(--expense); border-color: var(--expense); }
.type-toggle button.is-active.type-income { background: var(--income-bg); color: var(--income); border-color: var(--income); }

/* ============================================
   Modal & toasts
   ============================================ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(23, 43, 77, 0.38);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  padding: 0;
}
.modal-backdrop.is-open { display: flex; }
.modal {
  background: var(--surface);
  width: 100%;
  max-width: 480px;
  max-height: 88vh;
  overflow-y: auto;
  border-radius: 20px 20px 0 0;
  box-shadow: var(--shadow-lift);
  padding: 20px 20px 26px;
}
.modal__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal__close {
  border: none; background: var(--pale-blue); color: var(--navy);
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 14px;
}
body.dark-mode .modal__close { background: var(--surface-2); color: var(--text); }

@media (min-width: 640px) {
  .modal-backdrop { align-items: center; }
  .modal { border-radius: 20px; }
}

.toast-container {
  position: fixed;
  bottom: calc(var(--bottom-nav-h) + 18px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(92vw, 380px);
}
@media (min-width: 900px) { .toast-container { bottom: 24px; } }

.toast {
  background: var(--navy);
  color: #fff;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: var(--shadow-lift);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.toast--show { opacity: 1; transform: translateY(0); }
.toast--success { background: #4C7A5E; }
.toast--error { background: #A6503F; }
.toast--info { background: var(--soft-blue); color: var(--navy); }

/* ============================================
   Progress bars, badges
   ============================================ */
.progress-track {
  height: 10px;
  background: var(--pale-blue);
  border-radius: 999px;
  overflow: hidden;
}
body.dark-mode .progress-track { background: var(--surface-2); }
.progress-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; background: var(--soft-blue); }
.progress-fill--ok { background: var(--income); }
.progress-fill--mid { background: var(--soft-blue); }
.progress-fill--high { background: var(--warning); }
.progress-fill--over { background: var(--expense); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
}
.badge--income { background: var(--income-bg); color: var(--income); }
.badge--expense { background: var(--expense-bg); color: var(--expense); }
.badge--warning { background: var(--warning-bg); color: var(--warning); }
.badge--info { background: var(--info-bg); color: var(--info); }
.badge--muted { background: var(--pale-blue); color: var(--text-muted); }
body.dark-mode .badge--muted { background: var(--surface-2); }

/* ============================================
   Tables & transaction rows
   ============================================ */
.table-wrap { overflow-x: auto; }
table.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 620px; }
.data-table th {
  text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em;
  color: var(--text-muted); padding: 8px 10px; border-bottom: 1px solid var(--border);
}
.data-table td { padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table .amount-cell { font-weight: 700; white-space: nowrap; }
.data-table .amount-cell.income { color: var(--income); }
.data-table .amount-cell.expense { color: var(--expense); }
.row-actions { display: flex; gap: 6px; }
.row-actions button {
  border: none; background: var(--pale-blue); color: var(--navy);
  width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 13px;
}
body.dark-mode .row-actions button { background: var(--surface-2); color: var(--text); }

.tx-list { display: flex; flex-direction: column; gap: 2px; }
.tx-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 4px; border-bottom: 1px solid var(--border);
  gap: 12px;
}
.tx-row:last-child { border-bottom: none; }
.tx-row__left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tx-row__icon {
  width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  background: var(--pale-blue); font-size: 17px; flex-shrink: 0;
}
body.dark-mode .tx-row__icon { background: var(--surface-2); }
.tx-row__info { min-width: 0; }
.tx-row__title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.tx-row__meta { font-size: 12px; color: var(--text-muted); }
.tx-row__amount { font-weight: 800; white-space: nowrap; font-size: 14.5px; }
.tx-row__amount.income { color: var(--income); }
.tx-row__amount.expense { color: var(--expense); }

/* ============================================
   Filters toolbar
   ============================================ */
.filters-bar {
  display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center;
}
.filters-bar input[type="search"],
.filters-bar select {
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
}
.filters-bar input[type="search"] { flex: 1; min-width: 160px; }

/* ============================================
   Empty state
   ============================================ */
.empty-state {
  text-align: center;
  padding: 46px 20px;
  color: var(--text-muted);
}
.empty-state__icon { font-size: 34px; margin-bottom: 10px; }
.empty-state p { margin-bottom: 16px; font-size: 14px; }

/* ============================================
   Budget items
   ============================================ */
.budget-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
.budget-item:last-child { border-bottom: none; }
.budget-item__top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 8px; }
.budget-item__name { font-weight: 700; font-size: 14.5px; }
.budget-item__figures { font-size: 12.5px; color: var(--text-muted); }
.budget-item__pct { font-size: 12px; font-weight: 700; margin-top: 6px; text-align: right; }

/* ============================================
   Runway / timeline
   ============================================ */
.runway-status { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.runway-status__dot { width: 12px; height: 12px; border-radius: 50%; }
.runway-status__dot--on-track { background: var(--income); }
.runway-status__dot--careful { background: var(--warning); }
.runway-status__dot--at-risk { background: var(--expense); }
.runway-status__dot--unknown { background: var(--muted-grey); }

.timeline { position: relative; height: 54px; margin: 18px 4px 6px; }
.timeline__track { position: absolute; top: 24px; left: 0; right: 0; height: 4px; background: var(--pale-blue); border-radius: 999px; }
body.dark-mode .timeline__track { background: var(--surface-2); }
.timeline__fill { position: absolute; top: 24px; left: 0; height: 4px; background: var(--soft-blue); border-radius: 999px; }
.timeline__point { position: absolute; top: 16px; width: 20px; height: 20px; border-radius: 50%; background: var(--navy); border: 3px solid var(--surface); transform: translateX(-50%); }
.timeline__point--today { background: var(--baby-blue); }
.timeline__label { position: absolute; top: 44px; font-size: 11px; color: var(--text-muted); transform: translateX(-50%); white-space: nowrap; }

/* ============================================
   PTPTN allocation bars
   ============================================ */
.alloc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.alloc-row__label { width: 130px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.alloc-row input { width: 100px; flex-shrink: 0; }
.alloc-row__bar { flex: 1; }

/* ============================================
   Warnings list
   ============================================ */
.warning-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--warning-bg); color: var(--dark-text); font-size: 13.5px; margin-bottom: 8px;
}
body.dark-mode .warning-item { color: var(--text); }
.warning-item--info { background: var(--info-bg); }

/* ============================================
   Bottom nav & FAB (mobile)
   ============================================ */
.bottom-nav { display: none; }
.fab-wrap { position: fixed; right: 20px; bottom: calc(var(--bottom-nav-h) + 20px); z-index: 60; }
.fab {
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--navy); color: #fff; border: none;
  font-size: 28px; box-shadow: var(--shadow-lift); cursor: pointer;
  display: flex; align-items: center; justify-content: center; line-height: 1;
}
.fab-menu {
  position: absolute; bottom: 70px; right: 0;
  background: var(--surface); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lift); overflow: hidden; min-width: 170px;
  border: 1px solid var(--border);
}
.fab-menu button {
  display: block; width: 100%; text-align: left; border: none; background: transparent;
  color: var(--text); padding: 13px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.fab-menu button:hover { background: var(--pale-blue); }
body.dark-mode .fab-menu button:hover { background: var(--surface-2); }
.fab-menu button + button { border-top: 1px solid var(--border); }

/* ============================================
   Responsive
   ============================================ */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .page-content { padding: 18px 16px 110px; }
  .topbar { padding: 0 16px; }
  .two-col { grid-template-columns: 1fr; }
  .bottom-nav {
    display: flex;
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--bottom-nav-h);
    background: var(--surface); border-top: 1px solid var(--border);
    z-index: 60; padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-nav__link {
    flex: 1; border: none; background: transparent; color: var(--text-muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 10.5px; cursor: pointer; padding: 6px 0;
  }
  .bottom-nav__link span { font-size: 19px; }
  .bottom-nav__link[aria-current="page"] { color: var(--navy); }
  body.dark-mode .bottom-nav__link[aria-current="page"] { color: var(--baby-blue); }
  .fab-wrap { bottom: calc(var(--bottom-nav-h) + 16px); }
}

@media (max-width: 560px) {
  .form-grid { grid-template-columns: 1fr; }
  .card-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-card__value { font-size: 20px; }
  .topbar__title { font-size: 18px; }
  .semester-select__label { display: none; }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* Focus visibility */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--soft-blue);
  outline-offset: 2px;
}

</style>
</head>
<body>

<div id="app">

  <!-- Desktop / tablet sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__coin">🪙</span>
      <span class="sidebar__name">Duit Kira</span>
    </div>

    <nav class="sidebar__nav" id="sidebar-nav" aria-label="Main navigation">
      <button class="navlink" data-page="dashboard" aria-current="page">
        <span class="navlink__icon">🏠</span><span>Dashboard</span>
      </button>
      <button class="navlink" data-page="transactions">
        <span class="navlink__icon">🧾</span><span>Transactions</span>
      </button>
      <button class="navlink" data-page="budget">

/* ===== js/storage.js ===== */
/* storage.js
   Everything related to reading/writing app data in localStorage.
   No UI code lives here — other modules call these functions
   and re-render themselves.
*/

const STORAGE_KEYS = {
  transactions: 'mst_transactions',
  goals: 'mst_goals',
  categoryBudgets: 'mst_category_budgets',
  ptptnPlans: 'mst_ptptn_plans',
  recurring: 'mst_recurring',
  settings: 'mst_settings',
};

const DEFAULT_EXPENSE_CATEGORIES = [
  'Food', 'Transportation', 'Study / Academic', 'Accommodation',
  'Phone / Internet', 'Personal', 'Entertainment', 'Shopping',
  'Health', 'Emergency', 'K-pop / Hobby', 'Other',
];

const DEFAULT_INCOME_SOURCES = [
  'PTPTN', 'Scholarship', 'Family', 'Part-time job', 'Other',
];

const PAYMENT_METHODS = ['Cash', 'Debit card', 'Bank transfer', 'E-wallet'];

const DEFAULT_SETTINGS = {
  currentSemester: 'Semester 1',
  semesters: ['Semester 1', 'Semester 2', 'Semester 3', 'Semester 4'],
  semesterDates: {}, // { 'Semester 1': { start: 'YYYY-MM-DD', end: 'YYYY-MM-DD' } }
  monthlyBudget: 0,
  semesterBudgets: {}, // { 'Semester 1': amount }
  currency: 'RM',
  darkMode: false,
  expenseCategories: DEFAULT_EXPENSE_CATEGORIES.slice(),
  incomeSources: DEFAULT_INCOME_SOURCES.slice(),
};

function uid() {
  return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return fallback;
    const parsed = JSON.parse(raw);
    return parsed === null || parsed === undefined ? fallback : parsed;
  } catch (e) {
    console.error('Failed to read', key, e);
    return fallback;
  }
}

function writeJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    console.error('Failed to write', key, e);
    return false;
  }
}

const Store = {
  // ---------- Settings ----------
  getSettings() {
    const s = readJSON(STORAGE_KEYS.settings, null);
    if (!s) {
      writeJSON(STORAGE_KEYS.settings, DEFAULT_SETTINGS);
      return { ...DEFAULT_SETTINGS };
    }
    // merge in any new default keys added by future versions
    return { ...DEFAULT_SETTINGS, ...s };
  },
  saveSettings(partial) {
    const current = this.getSettings();
    const updated = { ...current, ...partial };
    writeJSON(STORAGE_KEYS.settings, updated);
    return updated;
  },

  // ---------- Transactions ----------
  getTransactions() {
    return readJSON(STORAGE_KEYS.transactions, []);
  },
  addTransaction(tx) {
    const list = this.getTransactions();
    const record = { id: uid(), ...tx };
    list.push(record);
    writeJSON(STORAGE_KEYS.transactions, list);
    return record;
  },
  updateTransaction(id, patch) {
    const list = this.getTransactions();
    const idx = list.findIndex((t) => t.id === id);
    if (idx === -1) return null;
    list[idx] = { ...list[idx], ...patch };
    writeJSON(STORAGE_KEYS.transactions, list);
    return list[idx];
  },
  deleteTransaction(id) {
    const list = this.getTransactions().filter((t) => t.id !== id);
    writeJSON(STORAGE_KEYS.transactions, list);
  },

  // ---------- Category budgets (recurring monthly per category) ----------
  getCategoryBudgets() {
    return readJSON(STORAGE_KEYS.categoryBudgets, []);
  },
  setCategoryBudget(category, amount) {
    const list = this.getCategoryBudgets();
    const idx = list.findIndex((b) => b.category === category);
    if (amount === null || amount === undefined || amount === '') {
      if (idx !== -1) list.splice(idx, 1);
    } else if (idx === -1) {
      list.push({ id: uid(), category, amount: Number(amount) });
    } else {
      list[idx].amount = Number(amount);
    }
    writeJSON(STORAGE_KEYS.categoryBudgets, list);
    return list;
  },

  // ---------- Goals ----------
  getGoals() {
    return readJSON(STORAGE_KEYS.goals, []);
  },
  addGoal(goal) {
    const list = this.getGoals();
    const record = { id: uid(), saved: 0, ...goal };
    list.push(record);
    writeJSON(STORAGE_KEYS.goals, list);
    return record;
  },
  updateGoal(id, patch) {
    const list = this.getGoals();
    const idx = list.findIndex((g) => g.id === id);
    if (idx === -1) return null;
    list[idx] = { ...list[idx], ...patch };
    writeJSON(STORAGE_KEYS.goals, list);
    return list[idx];
  },
  deleteGoal(id) {
    const list = this.getGoals().filter((g) => g.id !== id);
    writeJSON(STORAGE_KEYS.goals, list);
  },

  // ---------- PTPTN plans ----------
  getPtptnPlans() {
    return readJSON(STORAGE_KEYS.ptptnPlans, []);
  },
  addPtptnPlan(plan) {
    const list = this.getPtptnPlans();
    const record = { id: uid(), allocations: {}, ...plan };
    list.push(record);
    writeJSON(STORAGE_KEYS.ptptnPlans, list);
    return record;
  },
  updatePtptnPlan(id, patch) {
    const list = this.getPtptnPlans();
    const idx = list.findIndex((p) => p.id === id);
    if (idx === -1) return null;
    list[idx] = { ...list[idx], ...patch };
    writeJSON(STORAGE_KEYS.ptptnPlans, list);
    return list[idx];
  },
  deletePtptnPlan(id) {
    const list = this.getPtptnPlans().filter((p) => p.id !== id);
    writeJSON(STORAGE_KEYS.ptptnPlans, list);
  },

  // ---------- Recurring expenses ----------
  getRecurring() {
    return readJSON(STORAGE_KEYS.recurring, []);
  },
  addRecurring(item) {
    const list = this.getRecurring();
    const record = { id: uid(), ...item };
    list.push(record);
    writeJSON(STORAGE_KEYS.recurring, list);
    return record;
  },
  updateRecurring(id, patch) {
    const list = this.getRecurring();
    const idx = list.findIndex((r) => r.id === id);
    if (idx === -1) return null;
    list[idx] = { ...list[idx], ...patch };
    writeJSON(STORAGE_KEYS.recurring, list);
    return list[idx];
  },
  deleteRecurring(id) {
    const list = this.getRecurring().filter((r) => r.id !== id);
    writeJSON(STORAGE_KEYS.recurring, list);
  },

  // ---------- Bulk / data management ----------
  exportAll() {
    return {
      transactions: this.getTransactions(),
      categoryBudgets: this.getCategoryBudgets(),
      goals: this.getGoals(),
      ptptnPlans: this.getPtptnPlans(),
      recurring: this.getRecurring(),
      settings: this.getSettings(),
      exportedAt: new Date().toISOString(),
      version: 1,
    };
  },
  importAll(data) {
    if (!data || typeof data !== 'object') throw new Error('Invalid backup file');
    if (Array.isArray(data.transactions)) writeJSON(STORAGE_KEYS.transactions, data.transactions);
    if (Array.isArray(data.categoryBudgets)) writeJSON(STORAGE_KEYS.categoryBudgets, data.categoryBudgets);
    if (Array.isArray(data.goals)) writeJSON(STORAGE_KEYS.goals, data.goals);
    if (Array.isArray(data.ptptnPlans)) writeJSON(STORAGE_KEYS.ptptnPlans, data.ptptnPlans);
    if (Array.isArray(data.recurring)) writeJSON(STORAGE_KEYS.recurring, data.recurring);
    if (data.settings && typeof data.settings === 'object') {
      writeJSON(STORAGE_KEYS.settings, { ...DEFAULT_SETTINGS, ...data.settings });
    }
  },
  clearAll() {
    Object.values(STORAGE_KEYS).forEach((k) => localStorage.removeItem(k));
  },
};


/* ===== js/calculations.js ===== */
/* calculations.js
   Pure functions only — take data in, return numbers/objects out.
   No DOM access, no localStorage access. Keeps logic testable
   and easy to reuse across dashboard/budget/analytics/runway.
*/

const Calc = {
  safeNumber(n) {
    const v = Number(n);
    return Number.isFinite(v) ? v : 0;
  },

  sum(transactions, type) {
    return transactions
      .filter((t) => t.type === type)
      .reduce((acc, t) => acc + this.safeNumber(t.amount), 0);
  },

  totalIncome(transactions) {
    return this.sum(transactions, 'income');
  },
  totalExpense(transactions) {
    return this.sum(transactions, 'expense');
  },
  balance(transactions) {
    return this.totalIncome(transactions) - this.totalExpense(transactions);
  },

  monthKey(dateStr) {
    // 'YYYY-MM-DD' -> 'YYYY-MM'
    return typeof dateStr === 'string' && dateStr.length >= 7 ? dateStr.slice(0, 7) : '';
  },

  inMonth(t, monthKey) {
    return this.monthKey(t.date) === monthKey;
  },

  inSemester(t, semester) {
    return t.semester === semester;
  },

  filterByMonth(transactions, monthKey) {
    return transactions.filter((t) => this.inMonth(t, monthKey));
  },
  filterBySemester(transactions, semester) {
    return transactions.filter((t) => this.inSemester(t, semester));
  },

  currentMonthKey(date = new Date()) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    return `${y}-${m}`;
  },

  daysInMonth(monthKey) {
    if (!monthKey) return 30;
    const [y, m] = monthKey.split('-').map(Number);
    if (!y || !m) return 30;
    return new Date(y, m, 0).getDate();
  },

  daysRemainingInMonth(monthKey, today = new Date()) {
    const total = this.daysInMonth(monthKey);
    if (this.currentMonthKey(today) !== monthKey) return 0;
    return Math.max(total - today.getDate() + 1, 0);
  },

  averageDailySpending(transactions, sinceDate, today = new Date()) {
    const expenses = transactions.filter((t) => t.type === 'expense');
    if (expenses.length === 0) return 0;
    const dates = expenses.map((t) => new Date(t.date)).filter((d) => !isNaN(d));
    if (dates.length === 0) return 0;
    let earliest = sinceDate ? new Date(sinceDate) : new Date(Math.min(...dates));
    if (isNaN(earliest)) earliest = new Date(Math.min(...dates));
    const msPerDay = 1000 * 60 * 60 * 24;
    const daySpan = Math.max(Math.round((today - earliest) / msPerDay) + 1, 1);
    const total = this.totalExpense(expenses);
    return total / daySpan;
  },

  budgetUsagePercent(spent, budget) {
    const b = this.safeNumber(budget);
    if (b <= 0) return spent > 0 ? 100 : 0;
    return Math.round((this.safeNumber(spent) / b) * 100);
  },

  dailySpendingLimit(remainingBudget, daysRemaining) {
    if (daysRemaining <= 0) return null; // no days left to spend
    if (remainingBudget <= 0) return 0;
    return remainingBudget / daysRemaining;
  },

  savingsProgressPercent(saved, target) {
    const t = this.safeNumber(target);
    if (t <= 0) return 0;
    return Math.min(Math.round((this.safeNumber(saved) / t) * 100), 100);
  },

  daysBetween(startDate, endDate) {
    const msPerDay = 1000 * 60 * 60 * 24;
    const start = new Date(startDate);
    const end = new Date(endDate);
    if (isNaN(start) || isNaN(end)) return null;
    return Math.round((end - start) / msPerDay);
  },

  moneyRunway({ semesterStart, semesterEnd, currentBalance, avgDailySpending, today = new Date() }) {
    const result = {
      daysRemaining: null,
      avgDailySpending: this.safeNumber(avgDailySpending),
      suggestedMaxDaily: null,
      estimatedSpendUntilEnd: null,
      estimatedEndBalance: null,
      status: 'unknown', // 'on-track' | 'careful' | 'at-risk' | 'unknown'
    };
    if (!semesterStart || !semesterEnd) return result;

    const end = new Date(semesterEnd);
    const start = new Date(semesterStart);
    if (isNaN(end) || isNaN(start)) return result;

    const msPerDay = 1000 * 60 * 60 * 24;
    const daysRemaining = Math.max(Math.round((end - today) / msPerDay), 0);
    result.daysRemaining = daysRemaining;

    const balance = this.safeNumber(currentBalance);
    result.suggestedMaxDaily = daysRemaining > 0 ? balance / daysRemaining : 0;

    const spend = this.safeNumber(avgDailySpending) * daysRemaining;
    result.estimatedSpendUntilEnd = spend;
    result.estimatedEndBalance = balance - spend;

    if (daysRemaining <= 0) {
      result.status = 'unknown';
    } else if (result.estimatedEndBalance >= balance * 0.15 || result.estimatedEndBalance >= 0 && avgDailySpending <= result.suggestedMaxDaily) {
      result.status = 'on-track';
    } else if (result.estimatedEndBalance >= 0) {
      result.status = 'careful';
    } else {
      result.status = 'at-risk';
    }
    return result;
  },

  categoryTotals(transactions, type = 'expense') {
    const totals = {};
    transactions
      .filter((t) => t.type === type)
      .forEach((t) => {
        const cat = t.category || 'Other';
        totals[cat] = (totals[cat] || 0) + this.safeNumber(t.amount);
      });
    return totals;
  },

  highestCategory(totals) {
    let best = null;
    let bestVal = -Infinity;
    Object.entries(totals).forEach(([cat, val]) => {
      if (val > bestVal) {
        bestVal = val;
        best = cat;
      }
    });
    return best ? { category: best, amount: bestVal } : null;
  },

  monthlyTotals(transactions, type = 'expense') {
    const totals = {};
    transactions
      .filter((t) => t.type === type)
      .forEach((t) => {
        const key = this.monthKey(t.date);
        if (!key) return;
        totals[key] = (totals[key] || 0) + this.safeNumber(t.amount);
      });
    return totals;
  },

  formatMoney(amount, currency = 'RM') {
    const n = this.safeNumber(amount);
    const sign = n < 0 ? '-' : '';
    return `${sign}${currency} ${Math.abs(n).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,')}`;
  },

  formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString('en-MY', { day: '2-digit', month: 'short', year: 'numeric' });
  },
};


/* ===== js/ui.js ===== */
/* ui.js
   Small, generic UI helpers: toasts, modal open/close, confirm dialog.
   Page-specific rendering lives in app.js.
*/

const UI = {
  toastContainer: null,

  init() {
    this.toastContainer = document.getElementById('toast-container');
    // close modal on backdrop click
    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') this.closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') this.closeModal();
    });
  },

  toast(message, type = 'info') {
    if (!this.toastContainer) return;
    const el = document.createElement('div');
    el.className = `toast toast--${type}`;
    el.setAttribute('role', 'status');
    el.textContent = message;
    this.toastContainer.appendChild(el);
    requestAnimationFrame(() => el.classList.add('toast--show'));
    setTimeout(() => {
      el.classList.remove('toast--show');
      setTimeout(() => el.remove(), 250);
    }, 3200);
  },

  openModal(titleHtml, bodyHtml) {
    const backdrop = document.getElementById('modal-backdrop');
    const modal = document.getElementById('modal');
    document.getElementById('modal-title').textContent = titleHtml;
    document.getElementById('modal-body').innerHTML = bodyHtml;
    backdrop.classList.add('is-open');
    modal.classList.add('is-open');
    document.body.classList.add('no-scroll');
    const firstInput = modal.querySelector('input, select, textarea, button');
    if (firstInput) setTimeout(() => firstInput.focus(), 50);
  },

  closeModal() {
    document.getElementById('modal-backdrop').classList.remove('is-open');
    document.getElementById('modal').classList.remove('is-open');
    document.body.classList.remove('no-scroll');
    document.getElementById('modal-body').innerHTML = '';
  },

  confirm(message, onConfirm, opts = {}) {
    const body = `
      <p class="confirm-text">${message}</p>
      <div class="modal-actions">
        <button type="button" class="btn btn--ghost" data-action="cancel">Cancel</button>
        <button type="button" class="btn btn--danger" data-action="confirm">${opts.confirmLabel || 'Delete'}</button>
      </div>
    `;
    this.openModal(opts.title || 'Are you sure?', body);
    const modal = document.getElementById('modal');
    modal.querySelector('[data-action="cancel"]').addEventListener('click', () => this.closeModal());
    modal.querySelector('[data-action="confirm"]').addEventListener('click', () => {
      this.closeModal();
      onConfirm();
    });
  },

  emptyState(message, actionLabel, onAction) {
    const wrap = document.createElement('div');
    wrap.className = 'empty-state';
    wrap.innerHTML = `
      <div class="empty-state__icon">🪙</div>
      <p>${message}</p>
      ${actionLabel ? `<button type="button" class="btn btn--primary" data-empty-action>${actionLabel}</button>` : ''}
    `;
    if (actionLabel && onAction) {
      wrap.querySelector('[data-empty-action]').addEventListener('click', onAction);
    }
    return wrap;
  },

  escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  },
};

  ],

  destroy(key) {
    if (this.instances[key]) {
      this.instances[key].destroy();
      delete this.instances[key];

  destroyAll() {

  isDark() {

  gridColor() {

  textColor() {

  },

  spendingOverviewChart(canvasId, labels, incomeData, expenseData) {

            tension: 0.35,
            fill: true,
            pointRadius: 3,
          },
        ],
      },
      options: this.baseOptions(),
    });
  },

  categoryDoughnutChart(canvasId, labels, data) {

        labels,

          data,

          borderWidth: 2,
          borderColor: this.isDark() ? '#1E293B' : '#FAF9F6',
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,

          legend: {
            position: 'bottom',
            labels: { color: this.textColor(), padding: 14, font: { size: 12 } },
          },
        },
        cutout: '62%',
      },
    });

  monthlyBarChart(canvasId, labels, data) {
    this.destroy(canvasId);
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    this.instances[canvasId] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Spending',
          data,
          backgroundColor: this.palette.babyBlue,
          borderRadius: 6,
          maxBarThickness: 36,
        }],
      },
      options: this.baseOptions(),
    });
  },

  incomeVsExpenseChart(canvasId, labels, incomeData, expenseData) {
    this.destroy(canvasId);
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    this.instances[canvasId] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Income', data: incomeData, backgroundColor: this.palette.softBlue, borderRadius: 6, maxBarThickness: 28 },
          { label: 'Expenses', data: expenseData, backgroundColor: this.palette.navy, borderRadius: 6, maxBarThickness: 28 },
        ],
      },
      options: this.baseOptions(),
    });
  },

  baseOptions() {
    return {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: this.textColor(), padding: 14, font: { size: 12 } },
        },
      },
      scales: {
        x: {
          grid: { color: this.gridColor(), drawBorder: false },
          ticks: { color: this.textColor(), font: { size: 11 } },
        },
        y: {
          grid: { color: this.gridColor(), drawBorder: false },
          ticks: { color: this.textColor(), font: { size: 11 } },
          beginAtZero: true,
        },
      },
    };
  },
};

};
const SOURCE_ICONS = {

const App = {
  state: {
    page: 'dashboard',
    txFilters: { search: '', category: 'all', month: 'all', semester: 'all', sort: 'date-desc', type: 'all' },
    analyticsFilters: { month: 'all', semester: 'all', category: 'all' },

  el: null,

  init() {
    this.el = document.getElementById('page-content');
    UI.init();
    this.applyDarkMode(Store.getSettings().darkMode);
    this.populateSemesterSelect();
    this.bindGlobalEvents();
    this.navigate('dashboard');
  },

  // ---------------- navigation ----------------
  bindGlobalEvents() {
    document.querySelectorAll('.navlink, .bottom-nav__link').forEach((btn) => {
      btn.addEventListener('click', () => this.navigate(btn.dataset.page));
    });

    document.getElementById('darkmode-toggle').addEventListener('click', () => {
      const isDark = !document.body.classList.contains('dark-mode');
      this.applyDarkMode(isDark);
      Store.saveSettings({ darkMode: isDark });
      this.renderCurrentPage();
    });

    document.getElementById('modal-close').addEventListener('click', () => UI.closeModal());

    const semSelect = document.getElementById('global-semester-select');
    semSelect.addEventListener('change', () => {
      Store.saveSettings({ currentSemester: semSelect.value });
      this.renderCurrentPage();
    });

    const fab = document.getElementById('fab-add');
    const fabMenu = document.getElementById('fab-menu');
    fab.addEventListener('click', () => {
      fabMenu.hidden = !fabMenu.hidden;
    });
    document.addEventListener('click', (e) => {
      if (!fab.contains(e.target) && !fabMenu.contains(e.target)) fabMenu.hidden = true;
    });
    fabMenu.querySelectorAll('[data-fab-action]').forEach((btn) => {
      btn.addEventListener('click', () => {
        fabMenu.hidden = true;
        this.openTransactionForm(btn.dataset.fabAction);
      });
    });
  },

  applyDarkMode(isDark) {
    document.body.classList.toggle('dark-mode', isDark);
    document.getElementById('darkmode-toggle').setAttribute('aria-pressed', String(isDark));
    document.getElementById('darkmode-icon').textContent = isDark ? '☀️' : '🌙';
    document.getElementById('darkmode-label').textContent = isDark ? 'Light mode' : 'Dark mode';
  },

  populateSemesterSelect() {
    const settings = Store.getSettings();
    const select = document.getElementById('global-semester-select');
    select.innerHTML = settings.semesters.map((s) => `<option value="${UI.escapeHtml(s)}">${UI.escapeHtml(s)}</option>`).join('');
    select.value = settings.currentSemester;
  },

  navigate(page) {
    this.state.page = page;
    document.querySelectorAll('.navlink, .bottom-nav__link').forEach((btn) => {
      if (btn.dataset.page === page) btn.setAttribute('aria-current', 'page');
      else btn.removeAttribute('aria-current');
    });
    const titles = {
      dashboard: 'Dashboard', transactions: 'Transactions', budget: 'Budget Planner',
      ptptn: 'PTPTN Planning', savings: 'Savings Goals', analytics: 'Analytics', settings: 'Settings',
    };
    document.getElementById('page-title').textContent = titles[page] || 'Duit Kira';
    this.renderCurrentPage();
    this.el.focus();
    window.scrollTo({ top: 0, behavior: 'auto' });
  },

  renderCurrentPage() {
    Charts.destroyAll();
    const renderers = {
      dashboard: () => this.renderDashboard(),
      transactions: () => this.renderTransactions(),
      budget: () => this.renderBudget(),
      ptptn: () => this.renderPtptn(),
      savings: () => this.renderSavings(),
      analytics: () => this.renderAnalytics(),
      settings: () => this.renderSettings(),
    };
    (renderers[this.state.page] || renderers.dashboard)();
  },

  // ================================================================
  // DASHBOARD
  // ================================================================
  renderDashboard() {
    const settings = Store.getSettings();
    const all = Store.getTransactions();
    const currentSemester = settings.currentSemester;
    const monthKey = Calc.currentMonthKey();

    const totalIncome = Calc.totalIncome(all);
    const totalExpense = Calc.totalExpense(all);
    const balance = totalIncome - totalExpense;

    const monthTx = Calc.filterByMonth(all, monthKey);
    const monthSpent = Calc.totalExpense(monthTx);
    const monthBudget = Calc.safeNumber(settings.monthlyBudget);
    const remainingMonthBudget = monthBudget - monthSpent;

    const semTx = Calc.filterBySemester(all, currentSemester);
    const semesterBalance = Calc.totalIncome(semTx) - Calc.totalExpense(semTx);

    const avgDaily = Calc.averageDailySpending(all);
    const txCount = all.length;

    this.el.innerHTML = `
      <div class="card-grid">
        ${this.statCard('Total balance', Calc.formatMoney(balance), balance < 0 ? 'expense' : '')}
        ${this.statCard('Total received', Calc.formatMoney(totalIncome), 'income')}
        ${this.statCard('Total spent', Calc.formatMoney(totalExpense), 'expense')}
        ${this.statCard('Remaining monthly budget', Calc.formatMoney(remainingMonthBudget), remainingMonthBudget < 0 ? 'expense' : '')}
        ${this.statCard("This month's spending", Calc.formatMoney(monthSpent))}
        ${this.statCard("This month's budget", Calc.formatMoney(monthBudget))}
        ${this.statCard(`${UI.escapeHtml(currentSemester)} balance`, Calc.formatMoney(semesterBalance), semesterBalance < 0 ? 'expense' : '')}
        ${this.statCard('Average daily spending', Calc.formatMoney(avgDaily))}
        ${this.statCard('Transactions', String(txCount))}
      </div>

      <div class="btn-row">
        <button class="btn btn--primary" id="dash-add-expense">➖ Add expense</button>
        <button class="btn btn--secondary" id="dash-add-income">➕ Add income</button>
      </div>

      <div class="section-title"><h2>💸 Money Runway</h2></div>
      <div class="card" id="runway-card"></div>

      <div class="two-col" style="margin-top:20px;">
        <div class="card chart-card">
          <h3>Spending overview (last 6 months)</h3>
          <div class="chart-card__canvas-wrap"><canvas id="chart-overview"></canvas></div>
        </div>
        <div class="card chart-card">
          <h3>Spending by category (this month)</h3>
          <div class="chart-card__canvas-wrap"><canvas id="chart-category"></canvas></div>
        </div>
      </div>

      <div class="section-title"><h2>⚠️ Smart warnings</h2></div>
      <div id="warnings-wrap"></div>

      <div class="section-title"><h2>📅 Budget progress</h2></div>
      <div class="card" id="dash-budget-progress"></div>

      <div class="section-title">
        <h2>Recent transactions</h2>
        <button class="btn btn--ghost btn--sm" id="dash-see-all">See all</button>
      </div>
      <div class="card"><div class="tx-list" id="dash-recent-list"></div></div>
    `;

    document.getElementById('dash-add-expense').addEventListener('click', () => this.openTransactionForm('expense'));
    document.getElementById('dash-add-income').addEventListener('click', () => this.openTransactionForm('income'));
    document.getElementById('dash-see-all').addEventListener('click', () => this.navigate('transactions'));

    this.renderRunwayCard(document.getElementById('runway-card'), settings, all, currentSemester);
    this.renderWarnings(document.getElementById('warnings-wrap'), settings, all, monthKey);
    this.renderDashboardBudgetProgress(document.getElementById('dash-budget-progress'), settings, all, monthKey);

    // recent transactions
    const recentList = document.getElementById('dash-recent-list');
    const recent = [...all].sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 6);
    if (recent.length === 0) {
      recentList.appendChild(UI.emptyState('No transactions yet. Add your first expense to start tracking.', 'Add expense', () => this.openTransactionForm('expense')));
    } else {
      recentList.innerHTML = recent.map((t) => this.txRowHtml(t)).join('');
    }

    // charts
    this.renderOverviewChart(all);
    this.renderCategoryChartForMonth(all, monthKey);
  },

  statCard(label, value, tone) {
    const valClass = tone === 'income' ? 'stat-card__value--income' : tone === 'expense' ? 'stat-card__value--expense' : '';
    return `
      <div class="card stat-card">
        <span class="stat-card__label">${UI.escapeHtml(label)}</span>
        <span class="stat-card__value ${valClass}">${value}</span>
      </div>
    `;
  },

  renderRunwayCard(container, settings, all, currentSemester) {
    const dates = settings.semesterDates[currentSemester];
    if (!dates || !dates.start || !dates.end) {
      container.innerHTML = `
        <p class="form-hint">Set your semester start/end dates to see your money runway.</p>
        <button class="btn btn--soft btn--sm" id="runway-set-dates">Set semester dates</button>
      `;
      container.querySelector('#runway-set-dates').addEventListener('click', () => this.openSemesterDatesForm(currentSemester));
      return;
    }
    const semTx = Calc.filterBySemester(all, currentSemester);
    const balance = Calc.totalIncome(semTx) - Calc.totalExpense(semTx);
    const avgDaily = Calc.averageDailySpending(semTx, dates.start);
    const runway = Calc.moneyRunway({
      semesterStart: dates.start, semesterEnd: dates.end,
      currentBalance: balance, avgDailySpending: avgDaily,
    });

    const statusLabel = { 'on-track': 'On track', 'careful': 'Be careful', 'at-risk': 'At risk', 'unknown': 'Not enough data' }[runway.status];

    const today = new Date();
    const start = new Date(dates.start);
    const end = new Date(dates.end);
    let pct = 50;
    if (!isNaN(start) && !isNaN(end) && end > start) {
      pct = Math.min(Math.max(((today - start) / (end - start)) * 100, 0), 100);
    }

    container.innerHTML = `
      <div class="runway-status">
        <span class="runway-status__dot runway-status__dot--${runway.status}"></span>
        <strong>${statusLabel}</strong>
        <span class="form-hint">${runway.daysRemaining !== null ? `${runway.daysRemaining} days left in ${UI.escapeHtml(currentSemester)}` : ''}</span>
      </div>
      <div class="card-grid" style="margin-bottom:6px;">
        ${this.statCard('Current avg. daily spending', Calc.formatMoney(runway.avgDailySpending))}
        ${this.statCard('Suggested max daily spending', runway.suggestedMaxDaily !== null ? Calc.formatMoney(runway.suggestedMaxDaily) : '—')}
        ${this.statCard('Estimated balance at semester end', runway.estimatedEndBalance !== null ? Calc.formatMoney(runway.estimatedEndBalance) : '—', runway.estimatedEndBalance < 0 ? 'expense' : '')}
      </div>
      <div class="timeline">
        <div class="timeline__track"></div>
        <div class="timeline__fill" style="width:${pct}%"></div>
        <div class="timeline__point" style="left:0%"></div>
        <div class="timeline__label" style="left:0%">Start</div>
        <div class="timeline__point timeline__point--today" style="left:${pct}%"></div>
        <div class="timeline__label" style="left:${pct}%">Today</div>
        <div class="timeline__point" style="left:100%"></div>
        <div class="timeline__label" style="left:100%; transform: translateX(-100%);">End</div>
      </div>
      <button class="btn btn--ghost btn--sm" id="runway-edit-dates" style="margin-top:10px;">Edit semester dates</button>
    `;
    container.querySelector('#runway-edit-dates').addEventListener('click', () => this.openSemesterDatesForm(currentSemester));
  },

  renderWarnings(container, settings, all, monthKey) {
    const warnings = this.computeWarnings(settings, all, monthKey);
    if (warnings.length === 0) {
      container.innerHTML = `<div class="card"><p class="form-hint" style="margin:0;">No warnings right now — you're on top of your spending. 🎉</p></div>`;
      return;
    }
    container.innerHTML = warnings.map((w) => `<div class="warning-item ${w.tone === 'info' ? 'warning-item--info' : ''}">${w.icon} <span>${w.text}</span></div>`).join('');
  },

  computeWarnings(settings, all, monthKey) {
    const warnings = [];
    const catBudgets = Store.getCategoryBudgets();
    const monthTx = Calc.filterByMonth(all, monthKey);
    const catTotalsThisMonth = Calc.categoryTotals(monthTx, 'expense');

    catBudgets.forEach((b) => {
      const spent = catTotalsThisMonth[b.category] || 0;
      const pct = Calc.budgetUsagePercent(spent, b.amount);
      if (pct >= 100) {
        warnings.push({ icon: '🚨', tone: 'warn', text: `You are over your ${UI.escapeHtml(b.category)} budget (${pct}% used).` });
      } else if (pct >= 80) {
        warnings.push({ icon: '⚠️', tone: 'warn', text: `You have used ${pct}% of your ${UI.escapeHtml(b.category)} budget.` });
      }
    });

    // overall monthly budget
    const monthSpent = Calc.totalExpense(monthTx);
    if (Calc.safeNumber(settings.monthlyBudget) > 0) {
      const pct = Calc.budgetUsagePercent(monthSpent, settings.monthlyBudget);
      if (pct >= 100) warnings.push({ icon: '🚨', tone: 'warn', text: 'You are over your monthly budget.' });
      else if (pct >= 85) warnings.push({ icon: '⚠️', tone: 'warn', text: `You have used ${pct}% of your monthly budget.` });
    }

    // compare to last month
    const d = new Date();
    const lastMonthDate = new Date(d.getFullYear(), d.getMonth() - 1, 1);
    const lastMonthKey = Calc.currentMonthKey(lastMonthDate);
    const lastMonthSpent = Calc.totalExpense(Calc.filterByMonth(all, lastMonthKey));
    if (lastMonthSpent > 0 && monthSpent > lastMonthSpent) {
      warnings.push({ icon: 'ℹ️', tone: 'info', text: 'Your spending this month is higher than last month.' });
    }

    // vs planned daily average using monthly budget
    const daysRemaining = Calc.daysRemainingInMonth(monthKey);
    const remaining = Calc.safeNumber(settings.monthlyBudget) - monthSpent;
    const suggestedLimit = Calc.dailySpendingLimit(remaining, daysRemaining);
    const todayStr = new Date().toISOString().slice(0, 10);
    const todaySpent = Calc.totalExpense(monthTx.filter((t) => t.date === todayStr));
    if (suggestedLimit !== null && Calc.safeNumber(settings.monthlyBudget) > 0 && todaySpent > suggestedLimit) {
      warnings.push({ icon: '⚠️', tone: 'warn', text: 'You are spending more today than your suggested daily average.' });
    }

    return warnings;
  },

  renderDashboardBudgetProgress(container, settings, all, monthKey) {
    const catBudgets = Store.getCategoryBudgets();
    const monthTx = Calc.filterByMonth(all, monthKey);
    const spentByCat = Calc.categoryTotals(monthTx, 'expense');
    const monthBudget = Calc.safeNumber(settings.monthlyBudget);
    const monthSpent = Calc.totalExpense(monthTx);

    let html = this.budgetBarHtml('Overall monthly budget', monthSpent, monthBudget);
    if (catBudgets.length === 0) {
      html += `<p class="form-hint" style="margin-top:10px;">Set category budgets on the Budget page to see detailed progress here.</p>`;
    } else {
      html += catBudgets.map((b) => this.budgetBarHtml(b.category, spentByCat[b.category] || 0, b.amount)).join('');
    }
    container.innerHTML = html;
  },

  budgetBarHtml(name, spent, budget) {
    const pct = Calc.budgetUsagePercent(spent, budget);
    let cls = 'progress-fill--ok';
    if (pct >= 100) cls = 'progress-fill--over';
    else if (pct >= 80) cls = 'progress-fill--high';
    else if (pct >= 50) cls = 'progress-fill--mid';
    const barWidth = Math.min(pct, 100);
    return `
      <div class="budget-item">
        <div class="budget-item__top">
          <span class="budget-item__name">${UI.escapeHtml(name)}</span>
          <span class="budget-item__figures">${Calc.formatMoney(spent)} / ${budget > 0 ? Calc.formatMoney(budget) : 'no budget set'}</span>
        </div>
        <div class="progress-track"><div class="progress-fill ${cls}" style="width:${barWidth}%"></div></div>
        <div class="budget-item__pct">${pct}% used${pct >= 100 ? ' · over budget' : ''}</div>
      </div>
    `;
  },

  renderOverviewChart(all) {
    const months = [];
    const d = new Date();
    for (let i = 5; i >= 0; i--) {
      const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
      months.push(Calc.currentMonthKey(dt));
    }
    const labels = months.map((m) => {
      const [y, mo] = m.split('-');
      return new Date(Number(y), Number(mo) - 1, 1).toLocaleDateString('en-MY', { month: 'short' });
    });
    const incomeData = months.map((m) => Calc.totalIncome(Calc.filterByMonth(all, m)));
    const expenseData = months.map((m) => Calc.totalExpense(Calc.filterByMonth(all, m)));
    Charts.spendingOverviewChart('chart-overview', labels, incomeData, expenseData);
  },

  renderCategoryChartForMonth(all, monthKey) {
    const monthTx = Calc.filterByMonth(all, monthKey);
    const totals = Calc.categoryTotals(monthTx, 'expense');
    const entries = Object.entries(totals).sort((a, b) => b[1] - a[1]);
    if (entries.length === 0) {
      document.getElementById('chart-category').closest('.chart-card__canvas-wrap').innerHTML = '<p class="form-hint">No expenses recorded this month yet.</p>';
      return;
    }
    Charts.categoryDoughnutChart('chart-category', entries.map((e) => e[0]), entries.map((e) => e[1]));
  },

  // ================================================================
  // TRANSACTIONS
  // ================================================================
  renderTransactions() {
    const settings = Store.getSettings();
    const all = Store.getTransactions();
    const f = this.state.txFilters;

    const months = [...new Set(all.map((t) => Calc.monthKey(t.date)).filter(Boolean))].sort().reverse();
    const categories = [...new Set(all.map((t) => t.category).filter(Boolean))].sort();

    this.el.innerHTML = `
      <div class="btn-row">
        <button class="btn btn--primary" id="tx-add-expense">➖ Add expense</button>
        <button class="btn btn--secondary" id="tx-add-income">➕ Add income</button>
      </div>
      <div class="filters-bar">
        <input type="search" id="tx-search" placeholder="Search description, category, notes…" value="${UI.escapeHtml(f.search)}" aria-label="Search transactions" />
        <select id="tx-filter-type" aria-label="Filter by type">
          <option value="all">All types</option>
          <option value="income">Income only</option>
          <option value="expense">Expenses only</option>
        </select>
        <select id="tx-filter-category" aria-label="Filter by category">
          <option value="all">All categories</option>
          ${categories.map((c) => `<option value="${UI.escapeHtml(c)}">${UI.escapeHtml(c)}</option>`).join('')}
        </select>
        <select id="tx-filter-month" aria-label="Filter by month">
          <option value="all">All months</option>
          ${months.map((m) => `<option value="${m}">${m}</option>`).join('')}
        </select>
        <select id="tx-filter-semester" aria-label="Filter by semester">
          <option value="all">All semesters</option>
          ${settings.semesters.map((s) => `<option value="${UI.escapeHtml(s)}">${UI.escapeHtml(s)}</option>`).join('')}
        </select>
        <select id="tx-sort" aria-label="Sort transactions">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="amount-desc">Highest amount</option>
          <option value="amount-asc">Lowest amount</option>
        </select>
      </div>
      <div class="card"><div class="table-wrap" id="tx-table-wrap"></div></div>
    `;

    document.getElementById('tx-add-expense').addEventListener('click', () => this.openTransactionForm('expense'));
    document.getElementById('tx-add-income').addEventListener('click', () => this.openTransactionForm('income'));

    const searchEl = document.getElementById('tx-search');
    searchEl.addEventListener('input', () => { f.search = searchEl.value; this.renderTxTable(); });
    document.getElementById('tx-filter-type').value = f.type;
    document.getElementById('tx-filter-type').addEventListener('change', (e) => { f.type = e.target.value; this.renderTxTable(); });
    document.getElementById('tx-filter-category').value = f.category;
    document.getElementById('tx-filter-category').addEventListener('change', (e) => { f.category = e.target.value; this.renderTxTable(); });
    document.getElementById('tx-filter-month').value = f.month;
    document.getElementById('tx-filter-month').addEventListener('change', (e) => { f.month = e.target.value; this.renderTxTable(); });
    document.getElementById('tx-filter-semester').value = f.semester;
    document.getElementById('tx-filter-semester').addEventListener('change', (e) => { f.semester = e.target.value; this.renderTxTable(); });
    document.getElementById('tx-sort').value = f.sort;
    document.getElementById('tx-sort').addEventListener('change', (e) => { f.sort = e.target.value; this.renderTxTable(); });

    this.renderTxTable();
  },

  getFilteredTransactions() {
    const all = Store.getTransactions();
    const f = this.state.txFilters;
    let list = all.filter((t) => {
      if (f.type !== 'all' && t.type !== f.type) return false;
      if (f.category !== 'all' && t.category !== f.category) return false;
      if (f.month !== 'all' && Calc.monthKey(t.date) !== f.month) return false;
      if (f.semester !== 'all' && t.semester !== f.semester) return false;
      if (f.search) {
        const q = f.search.toLowerCase();
        const hay = `${t.description || ''} ${t.category || ''} ${t.notes || ''} ${t.paymentMethod || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const [sortKey, sortDir] = f.sort.split('-');
    list.sort((a, b) => {
      let cmp = 0;
      if (sortKey === 'date') cmp = (a.date || '').localeCompare(b.date || '');
      else cmp = Calc.safeNumber(a.amount) - Calc.safeNumber(b.amount);
      return sortDir === 'asc' ? cmp : -cmp;
    });
    return list;
  },

  renderTxTable() {
    const wrap = document.getElementById('tx-table-wrap');
    if (!wrap) return;
    const list = this.getFilteredTransactions();
    if (list.length === 0) {
      wrap.innerHTML = '';
      wrap.appendChild(UI.emptyState('No transactions match your filters yet.', 'Add expense', () => this.openTransactionForm('expense')));
      return;
    }
    wrap.innerHTML = `
      <table class="data-table">
        <thead><tr>
          <th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Method</th><th>Semester</th><th>Amount</th><th></th>
        </tr></thead>
        <tbody>
          ${list.map((t) => `
            <tr>
              <td>${Calc.formatDate(t.date)}</td>
              <td><span class="badge badge--${t.type}">${t.type === 'income' ? 'Income' : 'Expense'}</span></td>
              <td>${UI.escapeHtml(t.category || '—')}</td>
              <td>${UI.escapeHtml(t.description || '—')}</td>
              <td>${UI.escapeHtml(t.paymentMethod || '—')}</td>
              <td>${UI.escapeHtml(t.semester || '—')}</td>
              <td class="amount-cell ${t.type}">${t.type === 'income' ? '+' : '-'}${Calc.formatMoney(t.amount)}</td>
              <td>
                <div class="row-actions">
                  <button type="button" data-edit="${t.id}" aria-label="Edit">✏️</button>
                  <button type="button" data-delete="${t.id}" aria-label="Delete">🗑️</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('[data-edit]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const tx = Store.getTransactions().find((t) => t.id === btn.dataset.edit);
        if (tx) this.openTransactionForm(tx.type, tx);
      });
    });
    wrap.querySelectorAll('[data-delete]').forEach((btn) => {
      btn.addEventListener('click', () => {
        UI.confirm('Delete this transaction? This cannot be undone.', () => {
          Store.deleteTransaction(btn.dataset.delete);
          UI.toast('Transaction deleted', 'success');
          this.renderCurrentPage();
        });
      });
    });

  txRowHtml(t) {
    const icon = t.type === 'income' ? (SOURCE_ICONS[t.category] || '💰') : (CATEGORY_ICONS[t.category] || '🗂️');
    return `
      <div class="tx-row">
        <div class="tx-row__left">
          <div class="tx-row__icon">${icon}</div>
          <div class="tx-row__info">
            <div class="tx-row__title">${UI.escapeHtml(t.description || t.category || 'Transaction')}</div>
            <div class="tx-row__meta">${UI.escapeHtml(t.category || '')} · ${Calc.formatDate(t.date)}</div>
          </div>
        </div>
        <div class="tx-row__amount ${t.type}">${t.type === 'income' ? '+' : '-'}${Calc.formatMoney(t.amount)}</div>
      </div>
    `;
  },

  // ---- transaction form ----
  openTransactionForm(type, existing) {
    const settings = Store.getSettings();
    const isEdit = !!existing;
    const categories = type === 'income' ? settings.incomeSources : settings.expenseCategories;

    const body = `
      <form id="tx-form">
        <div class="type-toggle">
          <button type="button" data-type="expense" class="${type === 'expense' ? 'is-active type-expense' : ''}">➖ Expense</button>
          <button type="button" data-type="income" class="${type === 'income' ? 'is-active type-income' : ''}">➕ Income</button>
        </div>
        <input type="hidden" id="tx-type" value="${type}" />
        <div class="form-grid">
          <div class="form-field">
            <label for="tx-amount">Amount (RM)</label>
            <input type="number" id="tx-amount" min="0" step="0.01" inputmode="decimal" value="${existing ? existing.amount : ''}" required />
          </div>
          <div class="form-field">
            <label for="tx-date">Date</label>
            <input type="date" id="tx-date" value="${existing ? existing.date : new Date().toISOString().slice(0, 10)}" required />
          </div>
          <div class="form-field form-field--full">
            <label for="tx-category" id="tx-category-label">${type === 'income' ? 'Source' : 'Category'}</label>
            <select id="tx-category"></select>
          </div>
          <div class="form-field form-field--full">
            <label for="tx-description">Description</label>
            <input type="text" id="tx-description" placeholder="e.g. Lunch at campus café" value="${existing ? UI.escapeHtml(existing.description || '') : ''}" />
          </div>
          <div class="form-field">
            <label for="tx-payment">Payment method</label>
            <select id="tx-payment">
              ${PAYMENT_METHODS.map((p) => `<option value="${p}" ${existing && existing.paymentMethod === p ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
          </div>
          <div class="form-field">
            <label for="tx-semester">Semester</label>
            <select id="tx-semester">
              ${settings.semesters.map((s) => `<option value="${UI.escapeHtml(s)}" ${existing ? (existing.semester === s ? 'selected' : '') : (settings.currentSemester === s ? 'selected' : '')}>${UI.escapeHtml(s)}</option>`).join('')}
            </select>
          </div>
          <div class="form-field form-field--full">
            <label for="tx-notes">Notes</label>
            <textarea id="tx-notes">${existing ? UI.escapeHtml(existing.notes || '') : ''}</textarea>
          </div>
        </div>
        <p class="form-error" id="tx-form-error"></p>
        <div class="modal-actions">
          ${isEdit ? '<button type="button" class="btn btn--danger" id="tx-delete-btn">Delete</button>' : ''}
          <button type="submit" class="btn btn--primary">${isEdit ? 'Save changes' : 'Add transaction'}</button>
        </div>
      </form>
    `;
    UI.openModal(isEdit ? 'Edit transaction' : (type === 'income' ? 'Add income' : 'Add expense'), body);

    const form = document.getElementById('tx-form');
    const typeInput = document.getElementById('tx-type');
    const categorySelect = document.getElementById('tx-category');
    const categoryLabel = document.getElementById('tx-category-label');

    const fillCategories = (t) => {
      const list = t === 'income' ? settings.incomeSources : settings.expenseCategories;
      categoryLabel.textContent = t === 'income' ? 'Source' : 'Category';
      categorySelect.innerHTML = list.map((c) => `<option value="${UI.escapeHtml(c)}" ${existing && existing.category === c ? 'selected' : ''}>${UI.escapeHtml(c)}</option>`).join('');
    };
    fillCategories(type);

    form.querySelectorAll('.type-toggle button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.type;
        typeInput.value = t;
        form.querySelectorAll('.type-toggle button').forEach((b) => b.classList.remove('is-active', 'type-expense', 'type-income'));
        btn.classList.add('is-active', t === 'income' ? 'type-income' : 'type-expense');
        fillCategories(t);
      });
    });

    if (isEdit) {
      document.getElementById('tx-delete-btn').addEventListener('click', () => {
        UI.confirm('Delete this transaction? This cannot be undone.', () => {
          Store.deleteTransaction(existing.id);
          UI.closeModal();
          UI.toast('Transaction deleted', 'success');
          this.renderCurrentPage();
        });
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = Number(document.getElementById('tx-amount').value);
      const date = document.getElementById('tx-date').value;
      const errorEl = document.getElementById('tx-form-error');
      if (!amount || amount <= 0) { errorEl.textContent = 'Please enter an amount greater than 0.'; return; }
      if (!date) { errorEl.textContent = 'Please pick a date.'; return; }

      const record = {
        type: typeInput.value,
        amount,
        date,
        category: categorySelect.value,
        description: document.getElementById('tx-description').value.trim(),
        paymentMethod: document.getElementById('tx-payment').value,
        semester: document.getElementById('tx-semester').value,
        notes: document.getElementById('tx-notes').value.trim(),
      };

      if (isEdit) {
        Store.updateTransaction(existing.id, record);
        UI.toast('Transaction updated', 'success');
      } else {
        Store.addTransaction(record);
        UI.toast(`${record.type === 'income' ? 'Income' : 'Expense'} added`, 'success');
      }
      UI.closeModal();
      this.renderCurrentPage();
    });
  },

  // ================================================================
  // BUDGET PLANNER
  // ================================================================
  renderBudget() {
    const settings = Store.getSettings();
    const all = Store.getTransactions();
    const monthKey = Calc.currentMonthKey();
    const monthTx = Calc.filterByMonth(all, monthKey);
    const monthSpent = Calc.totalExpense(monthTx);
    const spentByCat = Calc.categoryTotals(monthTx, 'expense');
    const catBudgets = Store.getCategoryBudgets();
    const semTx = Calc.filterBySemester(all, settings.currentSemester);
    const semSpent = Calc.totalExpense(semTx);
    const semBudget = Calc.safeNumber(settings.semesterBudgets[settings.currentSemester]);

    this.el.innerHTML = `
      <div class="two-col">
        <div class="card">
          <div class="section-title" style="margin-top:0;"><h2>Monthly budget</h2>
            <button class="btn btn--soft btn--sm" id="edit-monthly-budget">Edit</button>
          </div>
          ${this.budgetBarHtml('This month', monthSpent, Calc.safeNumber(settings.monthlyBudget))}
        </div>
        <div class="card">
          <div class="section-title" style="margin-top:0;"><h2>${UI.escapeHtml(settings.currentSemester)} budget</h2>
            <button class="btn btn--soft btn--sm" id="edit-semester-budget">Edit</button>
          </div>
          ${this.budgetBarHtml(settings.currentSemester, semSpent, semBudget)}
        </div>
      </div>

      <div class="section-title">
        <h2>Category budgets (monthly)</h2>
        <button class="btn btn--primary btn--sm" id="add-category-budget">+ Set category budget</button>
      </div>
      <div class="card" id="category-budgets-wrap"></div>
    `;

    document.getElementById('edit-monthly-budget').addEventListener('click', () => this.openMonthlyBudgetForm());
    document.getElementById('edit-semester-budget').addEventListener('click', () => this.openSemesterBudgetForm(settings.currentSemester));
    document.getElementById('add-category-budget').addEventListener('click', () => this.openCategoryBudgetForm());

    const wrap = document.getElementById('category-budgets-wrap');
    if (catBudgets.length === 0) {
      wrap.appendChild(UI.emptyState('No category budgets yet. Set one for Food, Transport, or any category you want to control.', 'Set category budget', () => this.openCategoryBudgetForm()));
    } else {
      wrap.innerHTML = catBudgets
        .slice()
        .sort((a, b) => a.category.localeCompare(b.category))
        .map((b) => {
          const spent = spentByCat[b.category] || 0;
          const pct = Calc.budgetUsagePercent(spent, b.amount);
          let cls = 'progress-fill--ok';
          if (pct >= 100) cls = 'progress-fill--over';
          else if (pct >= 80) cls = 'progress-fill--high';
          else if (pct >= 50) cls = 'progress-fill--mid';
          return `
            <div class="budget-item">
              <div class="budget-item__top">
                <span class="budget-item__name">${CATEGORY_ICONS[b.category] || '🗂️'} ${UI.escapeHtml(b.category)}</span>
                <div class="row-actions">
                  <button type="button" data-edit-budget="${UI.escapeHtml(b.category)}" aria-label="Edit">✏️</button>
                  <button type="button" data-delete-budget="${UI.escapeHtml(b.category)}" aria-label="Delete">🗑️</button>
                </div>
              </div>
              <div class="budget-item__figures">${Calc.formatMoney(spent)} / ${Calc.formatMoney(b.amount)}</div>
              <div class="progress-track"><div class="progress-fill ${cls}" style="width:${Math.min(pct, 100)}%"></div></div>
              <div class="budget-item__pct">${pct}% used${pct >= 100 ? ' · over budget' : ''}</div>
            </div>
          `;
        }).join('');
      wrap.querySelectorAll('[data-edit-budget]').forEach((btn) => {
        btn.addEventListener('click', () => this.openCategoryBudgetForm(btn.dataset.editBudget));
      });
      wrap.querySelectorAll('[data-delete-budget]').forEach((btn) => {
        btn.addEventListener('click', () => {
          UI.confirm(`Remove the budget for ${btn.dataset.deleteBudget}?`, () => {
            Store.setCategoryBudget(btn.dataset.deleteBudget, null);
            UI.toast('Category budget removed', 'success');
            this.renderCurrentPage();
          });
        });
      });
    }
  },

      <form id="sem-budget-form">
        <div class="form-field">
          <label for="sem-budget-amount">${UI.escapeHtml(semester)} budget (RM)</label>

      </form>

      UI.closeModal();
