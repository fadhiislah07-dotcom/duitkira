/* ===== js/cloud-sync.js ===== */
/* cloud-sync.js
   ============================================================
   Wraps Firebase Auth (Google sign-in) + Firestore so the rest of
   the app can stay almost untouched. Everything here is OPTIONAL:

   - If js/firebase-config.js still has placeholder values, or the
     Firebase SDK scripts didn't load, CloudSync.enabled stays false
     and the whole app behaves exactly like the local-only version.
   - Once configured, signing in loads/creates the user's data under
     users/{uid}/... in Firestore and keeps it in sync in real time.
   - localStorage is still always written to first — it's the local
     cache the rest of the app reads from — so the UI never blocks
     on a network round trip and still works offline.

   Firestore layout (see README for the security rules that match it):
     users/{uid}/transactions/{id}
     users/{uid}/budgets/{id}        (category budgets)
     users/{uid}/goals/{id}
     users/{uid}/ptptnPlans/{id}
     users/{uid}/recurring/{id}
     users/{uid}/settings/main
   ============================================================ */

const COLLECTION_MAP = {
  transactions: 'transactions',
  categoryBudgets: 'budgets',
  goals: 'goals',
  ptptnPlans: 'ptptnPlans',
  recurring: 'recurring',
  templates: 'templates',
};

const CloudSync = {
  enabled: false,
  ready: false, // true once the first auth check has resolved
  app: null,
  auth: null,
  db: null,
  user: null,
  status: 'signed-out', // 'signed-out' | 'syncing' | 'synced' | 'offline' | 'error'
  listeners: {},
  _applyingRemote: false,

  // callbacks the UI layer (app.js) fills in
  onAuthChange: null,
  onRemoteChange: null,
  onStatusChange: null,

  isConfigured() {
    try {
      return (
        typeof FIREBASE_CONFIG !== 'undefined' &&
        typeof firebase !== 'undefined' &&
        !!FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.includes('YOUR_') &&
        !!FIREBASE_CONFIG.projectId && !FIREBASE_CONFIG.projectId.includes('YOUR_')
      );
    } catch (e) {
      return false;
    }
  },

  init() {
    this.enabled = this.isConfigured();
    if (!this.enabled) {
      this.ready = true;
      return false;
    }
    try {
      this.app = firebase.initializeApp(FIREBASE_CONFIG);
      this.auth = firebase.auth();
      this.db = firebase.firestore();
      this.db.settings({ ignoreUndefinedProperties: true });
      try {
        this.db.enablePersistence({ synchronizeTabs: true }).catch(() => {
          // multiple tabs open, or browser doesn't support it — fine,
          // sync still works, just without offline cache persistence
        });
      } catch (e) { /* enablePersistence not available — non-fatal */ }

      window.addEventListener('online', () => {
        if (this.user) this.setStatus('syncing');
      });
      window.addEventListener('offline', () => this.setStatus('offline'));

      // finishes a signInWithRedirect() flow, if one was in progress
      this.auth.getRedirectResult().catch((err) => {
        console.error('Redirect sign-in failed', err);
      });

      this.auth.onAuthStateChanged((user) => this.handleAuthChange(user));
    } catch (e) {
      console.error('Firebase init failed', e);
      this.enabled = false;
      this.ready = true;
    }
    return this.enabled;
  },

  setStatus(status) {
    this.status = status;
    if (this.onStatusChange) this.onStatusChange(status);
  },

  handleAuthChange(user) {
    this.user = user;
    this.ready = true;
    this.teardownListeners();
    if (user) {
      this.setStatus(navigator.onLine ? 'syncing' : 'offline');
      // NOTE: listeners are attached later, by the caller, via attachListeners() —
      // not here. If we attached them immediately, a first-time sign-in with an
      // empty cloud account could overwrite the local cache with an empty
      // snapshot before the "import your existing data?" decision is made.
    } else {
      this.setStatus('signed-out');
    }
    if (this.onAuthChange) this.onAuthChange(user);
  },

  async signIn() {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await this.auth.signInWithPopup(provider);
      return { ok: true };
    } catch (err) {
      if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
        return { ok: false, cancelled: true };
      }
      if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
        try {
          await this.auth.signInWithRedirect(provider);
          return { ok: true, redirecting: true };
        } catch (redirectErr) {
          return { ok: false, error: redirectErr };
        }
      }
      return { ok: false, error: err };
    }
  },

  async signOutUser() {
    this.teardownListeners();
    await this.auth.signOut();
  },

  // ---------- Firestore live listeners (cloud → local cache) ----------
  attachListeners() {
    const uid = this.user.uid;
    const userRef = this.db.collection('users').doc(uid);

    Object.entries(COLLECTION_MAP).forEach(([localKey, remoteName]) => {
      this.listeners[localKey] = userRef.collection(remoteName).onSnapshot(
        (snap) => {
          const items = [];
          snap.forEach((doc) => items.push({ id: doc.id, ...doc.data() }));
          this._applyingRemote = true;
          Store.replaceCollection(localKey, items);
          this._applyingRemote = false;
          if (this.onRemoteChange) this.onRemoteChange(localKey);
          this.setStatus(snap.metadata.hasPendingWrites ? 'syncing' : 'synced');
        },
        (err) => {
          console.error('Firestore listener error:', remoteName, err);
          this.setStatus('error');
        }
      );
    });

    this.listeners.settings = userRef.collection('settings').doc('main').onSnapshot(
      (doc) => {
        if (doc.exists) {
          this._applyingRemote = true;
          Store.replaceSettingsFromCloud(doc.data());
          this._applyingRemote = false;
          if (this.onRemoteChange) this.onRemoteChange('settings');
        }
        this.setStatus(doc.metadata && doc.metadata.hasPendingWrites ? 'syncing' : 'synced');
      },
      (err) => {
        console.error('Firestore settings listener error:', err);
        this.setStatus('error');
      }
    );
  },

  teardownListeners() {
    Object.values(this.listeners).forEach((unsub) => {
      if (typeof unsub === 'function') unsub();
    });
    this.listeners = {};
  },

  // ---------- local → cloud pushes (called by storage.js after a local write) ----------
  pushDoc(localKey, id, data) {
    if (!this.enabled || !this.user || this._applyingRemote) return;
    const remoteName = COLLECTION_MAP[localKey];
    if (!remoteName) return;
    this.setStatus('syncing');
    this.db.collection('users').doc(this.user.uid).collection(remoteName).doc(id).set(data)
      .catch((err) => { console.error('Cloud push failed', localKey, err); this.setStatus('error'); });
  },

  deleteDoc(localKey, id) {
    if (!this.enabled || !this.user || this._applyingRemote) return;
    const remoteName = COLLECTION_MAP[localKey];
    if (!remoteName) return;
    this.setStatus('syncing');
    this.db.collection('users').doc(this.user.uid).collection(remoteName).doc(id).delete()
      .catch((err) => { console.error('Cloud delete failed', localKey, err); this.setStatus('error'); });
  },

  pushSettings(settings) {
    if (!this.enabled || !this.user || this._applyingRemote) return;
    this.setStatus('syncing');
    this.db.collection('users').doc(this.user.uid).collection('settings').doc('main').set(settings, { merge: true })
      .catch((err) => { console.error('Cloud settings push failed', err); this.setStatus('error'); });
  },

  // ---------- migration ----------
  async cloudHasAnyData() {
    const uid = this.user.uid;
    const userRef = this.db.collection('users').doc(uid);
    for (const remoteName of Object.values(COLLECTION_MAP)) {
      const snap = await userRef.collection(remoteName).limit(1).get();
      if (!snap.empty) return true;
    }
    const settingsDoc = await userRef.collection('settings').doc('main').get();
    return settingsDoc.exists;
  },

  async migrateLocalToCloud(bundle) {
    const uid = this.user.uid;
    const userRef = this.db.collection('users').doc(uid);
    for (const [localKey, remoteName] of Object.entries(COLLECTION_MAP)) {
      const items = bundle[localKey] || [];
      for (let i = 0; i < items.length; i += 400) {
        const batch = this.db.batch();
        items.slice(i, i + 400).forEach((item) => {
          const { id, ...rest } = item;
          batch.set(userRef.collection(remoteName).doc(id), rest);
        });
        await batch.commit();
      }
    }
    if (bundle.settings) {
      await userRef.collection('settings').doc('main').set(bundle.settings, { merge: true });
    }
  },

  // ---------- delete all cloud data (settings page "delete cloud data") ----------
  async deleteAllCloudData() {
    const uid = this.user.uid;
    const userRef = this.db.collection('users').doc(uid);
    for (const remoteName of Object.values(COLLECTION_MAP)) {
      const snap = await userRef.collection(remoteName).get();
      const docs = snap.docs;
      for (let i = 0; i < docs.length; i += 400) {
        const batch = this.db.batch();
        docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
        await batch.commit();
      }
    }
    await userRef.collection('settings').doc('main').delete().catch(() => {});
  },
};


/* ===== js/app.js ===== */
/* app.js
   Application controller: routing between pages, rendering each
   page's HTML from current data, and wiring up forms/buttons.
*/

const CATEGORY_ICONS = {
  'Food': 'icon-food', 'Transportation': 'icon-transport', 'Study / Academic': 'icon-book',
  'Accommodation': 'icon-home', 'Phone / Internet': 'icon-phone', 'Personal': 'icon-user',
  'Entertainment': 'icon-film', 'Shopping': 'icon-bag', 'Health': 'icon-health',
  'Emergency': 'icon-alert', 'Hobby': 'icon-music', 'Other': 'icon-more',
  'K-pop / Hobby': 'icon-music',
  'Savings': 'icon-piggy',
};
const SOURCE_ICONS = {
  'PTPTN/Scholarship': 'icon-cap', 'Family': 'icon-family',
  'Part-time job': 'icon-briefcase', 'Other': 'icon-more',
  // aliases so older transactions saved before PTPTN/Scholarship were merged
  // still get a matching icon instead of the generic fallback
  'PTPTN': 'icon-cap', 'Scholarship': 'icon-award',
};

function iconTag(iconId, cls) {
  return `<svg class="${cls}" aria-hidden="true"><use href="#${iconId}"/></svg>`;
}

const App = {
  state: {
    page: 'dashboard',
    txFilters: { search: '', category: 'all', month: 'all', semester: 'all', sort: 'date-desc', type: 'all' },
    analyticsFilters: { month: 'all', semester: 'all', category: 'all' },
  },

  el: null,

  init() {
    this.el = document.getElementById('page-content');
    UI.init();
    I18N.init(Store.getSettings().language);
    this.applyDarkMode(Store.getSettings().darkMode);
    this.applyStaticTranslations();
    this.populateSemesterSelect();
    this.bindGlobalEvents();

    const signInBtn = document.getElementById('google-signin-btn');
    if (signInBtn) signInBtn.addEventListener('click', () => this.handleSignInClick());

    const cloudConfigured = typeof CloudSync !== 'undefined' && CloudSync.isConfigured();

    if (!cloudConfigured) {
      // Local-only mode — no Firebase config supplied yet, so Duit Kira
      // behaves exactly like it always has. See js/firebase-config.js.
      document.getElementById('auth-gate').hidden = true;
      document.getElementById('app').hidden = false;
      this.navigate('dashboard');
      return;
    }

    // Cloud sync is configured — hide the app while we check whether this
    // visitor is already signed in, so local data never flashes on screen
    // before the sign-in gate.
    document.getElementById('app').hidden = true;
    document.getElementById('auth-gate').hidden = false;
    const note = document.getElementById('auth-card-note');
    if (note) note.textContent = 'Checking your session…';

    CloudSync.onStatusChange = (status) => this.updateSyncBadge(status);
    CloudSync.onRemoteChange = () => { this.populateSemesterSelect(); this.renderCurrentPage(); };
    CloudSync.onAuthChange = (user) => this.handleAuthChange(user);
    CloudSync.init();
  },

  // ---------------- Google sign-in / cloud sync ----------------
  async handleSignInClick() {
    const btn = document.getElementById('google-signin-btn');
    const note = document.getElementById('auth-card-note');
    btn.disabled = true;
    note.className = 'auth-card__note';
    note.textContent = 'Opening Google sign-in…';
    try {
      const result = await CloudSync.signIn();
      if (result.cancelled) {
        note.textContent = '';
      } else if (result.redirecting) {
        note.textContent = 'Redirecting to Google…';
      } else if (!result.ok) {
        console.error(result.error);
        note.className = 'auth-card__note auth-card__note--error';
        note.textContent = 'Sign-in failed — please try again.';
      }
    } catch (e) {
      console.error(e);
      note.className = 'auth-card__note auth-card__note--error';
      note.textContent = 'Sign-in failed — please try again.';
    }
    btn.disabled = false;
  },

  handleAuthChange(user) {
    const authGate = document.getElementById('auth-gate');
    const appEl = document.getElementById('app');
    if (user) {
      authGate.hidden = true;
      appEl.hidden = false;
      this.renderAccountUI(user);
      this.checkMigrationAndRender();
    } else {
      appEl.hidden = true;
      authGate.hidden = false;
      this.renderAccountUI(null);
      const note = document.getElementById('auth-card-note');
      if (note) note.textContent = '';
    }
  },

  async checkMigrationAndRender() {
    try {
      const localBundle = Store.exportAll();
      const hasLocalData = localBundle.transactions.length > 0 || localBundle.goals.length > 0 ||
        localBundle.categoryBudgets.length > 0 || localBundle.ptptnPlans.length > 0 || localBundle.recurring.length > 0;
      if (hasLocalData) {
        const cloudHasData = await CloudSync.cloudHasAnyData();
        if (!cloudHasData) {
          this.offerMigration(localBundle);
          return;
        }
      }
    } catch (e) {
      console.error('Migration check failed', e);
    }
    // No migration needed (cloud already has data, or there's nothing local
    // to migrate) — safe to start the live listeners now.
    CloudSync.attachListeners();
    this.populateSemesterSelect();
    this.navigate(this.state.page || 'dashboard');
  },

  offerMigration(localBundle) {
    const count = localBundle.transactions.length;
    const body = `
      <p>We found existing data saved on this device (${count} transaction${count === 1 ? '' : 's'}, plus budgets/goals/PTPTN/Scholarship records). Your account has no cloud data yet — import this device's data into your account?</p>
      <div class="modal-actions">
        <button type="button" class="btn btn--ghost" id="migrate-skip">Skip — start fresh</button>
        <button type="button" class="btn btn--primary" id="migrate-yes">Import my data</button>
      </div>
    `;
    UI.openModal('Import existing data?', body);
    document.getElementById('migrate-skip').addEventListener('click', () => {
      UI.closeModal();
      // Starting fresh means the cloud (currently empty) is authoritative —
      // attach listeners now so it takes over and clears the local cache.
      CloudSync.attachListeners();
      this.populateSemesterSelect();
      this.navigate('dashboard');
    });
    document.getElementById('migrate-yes').addEventListener('click', async () => {
      UI.closeModal();
      UI.toast('Importing your data…', 'info');
      try {
        await CloudSync.migrateLocalToCloud(localBundle);
        UI.toast('Import complete — synced to your account', 'success');
      } catch (e) {
        console.error(e);
        UI.toast("Import failed — your local data is safe. Try again from Settings.", 'error');
      }
      // Attach listeners after the upload completes, so the incoming
      // snapshot reflects what we just wrote instead of racing it.
      CloudSync.attachListeners();
      this.populateSemesterSelect();
      this.navigate('dashboard');
    });
  },

  renderAccountUI(user) {
    const container = document.getElementById('sidebar-account');
    if (!container) return;
    if (!user) {
      container.hidden = true;
      container.innerHTML = '';
      return;
    }
    container.hidden = false;
    const initial = UI.escapeHtml((user.displayName || user.email || '?').charAt(0).toUpperCase());
    const avatar = user.photoURL
      ? `<img class="account-chip__avatar" src="${UI.escapeHtml(user.photoURL)}" alt="" referrerpolicy="no-referrer" />`
      : `<span class="account-chip__avatar account-chip__avatar--fallback">${initial}</span>`;
    container.innerHTML = `
      <div class="account-chip">
        ${avatar}
        <div class="account-chip__info">
          <span class="account-chip__name">${UI.escapeHtml(user.displayName || 'Signed in')}</span>
          <span class="account-chip__email">${UI.escapeHtml(user.email || '')}</span>
        </div>
      </div>
      <button type="button" class="account-signout" id="sidebar-signout-btn">
        <svg aria-hidden="true"><use href="#icon-logout"/></svg><span>Sign out</span>
      </button>
    `;
    document.getElementById('sidebar-signout-btn').addEventListener('click', () => this.confirmSignOut());
  },

  confirmSignOut() {
    UI.confirm('Sign out of Duit Kira? Your data stays safely in your account.', async () => {
      try {
        await CloudSync.signOutUser();
        UI.toast('Signed out', 'success');
      } catch (e) {
        console.error(e);
        UI.toast('Could not sign out — try again.', 'error');
      }
    }, { title: 'Sign out?', confirmLabel: 'Sign out' });
  },

  updateSyncBadge(status) {
    const badge = document.getElementById('sync-badge');
    if (!badge) return;
    const map = {
      syncing: { text: 'Syncing…', cls: 'sync-badge--syncing' },
      synced: { text: 'Synced', cls: 'sync-badge--synced' },
      offline: { text: 'Offline', cls: 'sync-badge--offline' },
      error: { text: 'Sync error', cls: 'sync-badge--error' },
      'signed-out': { text: '', cls: '' },
    };
    const info = map[status] || map['signed-out'];
    badge.className = `sync-badge ${info.cls}`;
    badge.textContent = info.text;
    badge.hidden = !info.text;
  },

  // ---------------- navigation ----------------
  bindGlobalEvents() {
    document.querySelectorAll('.navlink[data-page], .bottom-nav__link[data-page]').forEach((btn) => {
      btn.addEventListener('click', () => this.navigate(btn.dataset.page));
    });

    document.getElementById('bottom-nav-more').addEventListener('click', () => this.openMoreMenu());
    document.getElementById('global-search-btn').addEventListener('click', () => this.openGlobalSearch());

    document.getElementById('darkmode-toggle').addEventListener('click', () => {
      const isDark = !document.body.classList.contains('dark-mode');
      this.applyDarkMode(isDark);
      Store.saveSettings({ darkMode: isDark });
      this.renderCurrentPage();
    });

    document.getElementById('darkmode-toggle-mobile').addEventListener('click', () => {
      const isDark = !document.body.classList.contains('dark-mode');
      this.applyDarkMode(isDark);
      Store.saveSettings({ darkMode: isDark });
      this.renderCurrentPage();
    });

    document.getElementById('modal-close').addEventListener('click', () => UI.closeModal());

    const semSelect = document.getElementById('global-semester-select');
    semSelect.addEventListener('change', () => {
      Store.saveSettings({ currentSemester: semSelect.value });
      this.renderCurrentPage();
    });

    const fab = document.getElementById('fab-add');
    const fabMenu = document.getElementById('fab-menu');
    fab.addEventListener('click', () => {
      fabMenu.hidden = !fabMenu.hidden;
      fab.setAttribute('aria-expanded', String(!fabMenu.hidden));
      fab.classList.toggle('fab--open', !fabMenu.hidden);
    });
    document.addEventListener('click', (e) => {
      if (!fab.contains(e.target) && !fabMenu.contains(e.target)) {
        fabMenu.hidden = true;
        fab.setAttribute('aria-expanded', 'false');
        fab.classList.remove('fab--open');
      }
    });
    fabMenu.querySelectorAll('[data-fab-action]').forEach((btn) => {
      btn.addEventListener('click', () => {
        fabMenu.hidden = true;
        fab.setAttribute('aria-expanded', 'false');
        fab.classList.remove('fab--open');
        this.openTransactionForm(btn.dataset.fabAction);
      });
    });
  },

  applyDarkMode(isDark) {
    document.body.classList.toggle('dark-mode', isDark);
    document.getElementById('darkmode-toggle').setAttribute('aria-pressed', String(isDark));
    document.getElementById('darkmode-toggle-mobile').setAttribute('aria-pressed', String(isDark));
    const use = document.querySelector('#darkmode-icon use');
    if (use) use.setAttribute('href', isDark ? '#icon-sun' : '#icon-moon');
    const mobileUse = document.querySelector('#darkmode-toggle-mobile use');
    if (mobileUse) mobileUse.setAttribute('href', isDark ? '#icon-sun' : '#icon-moon');
    document.getElementById('darkmode-label').textContent = isDark ? t('label_light_mode') : t('label_dark_mode');
  },

  applyStaticTranslations() {
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      el.textContent = t(el.dataset.i18n);
    });
  },

  populateSemesterSelect() {
    const settings = Store.getSettings();
    const select = document.getElementById('global-semester-select');
    select.innerHTML = settings.semesters.map((s) => `<option value="${UI.escapeHtml(s)}">${UI.escapeHtml(s)}</option>`).join('');
    select.value = settings.currentSemester;
  },

  navigate(page) {
    this.state.page = page;
    document.querySelectorAll('.navlink[data-page], .bottom-nav__link[data-page]').forEach((btn) => {
      if (btn.dataset.page === page) btn.setAttribute('aria-current', 'page');
      else btn.removeAttribute('aria-current');
    });
    const moreBtn = document.getElementById('bottom-nav-more');
    if (['ptptn', 'savings', 'settings', 'guide'].includes(page)) moreBtn.setAttribute('aria-current', 'page');
    else moreBtn.removeAttribute('aria-current');
    const titles = {
      dashboard: t('title_dashboard'), transactions: t('title_transactions'), budget: t('title_budget'),
      ptptn: t('title_ptptn'), savings: t('title_savings'), analytics: t('title_analytics'), settings: t('title_settings'),
      guide: t('title_guide'),
    };
    document.getElementById('page-title').textContent = titles[page] || 'Duit Kira';
    this.renderCurrentPage();
    this.el.focus();
    window.scrollTo({ top: 0, behavior: 'auto' });
  },

  openMoreMenu() {
    const items = [
      { page: 'ptptn', icon: 'icon-cap', label: 'PTPTN/Scholarship Planning' },
      { page: 'savings', icon: 'icon-piggy', label: 'Savings Goals' },
      { page: 'settings', icon: 'icon-gear', label: 'Settings' },
      { page: 'guide', icon: 'icon-help', label: 'Guide' },
    ];
    const user = (typeof CloudSync !== 'undefined' && CloudSync.enabled) ? CloudSync.user : null;
    const initial = user ? UI.escapeHtml((user.displayName || user.email || '?').charAt(0).toUpperCase()) : '';
    const avatar = user && user.photoURL
      ? `<img class="more-account__avatar" src="${UI.escapeHtml(user.photoURL)}" alt="" referrerpolicy="no-referrer" />`
      : `<span class="more-account__avatar more-account__avatar--fallback">${initial}</span>`;
    const accountBlock = user ? `
      <div class="more-account">
        ${avatar}
        <div>
          <div class="more-account__name">${UI.escapeHtml(user.displayName || 'Signed in')}</div>
          <div class="more-account__email">${UI.escapeHtml(user.email || '')}</div>
        </div>
      </div>
    ` : '';
    const body = `
      ${accountBlock}
      <div class="list-menu">
        ${items.map((i) => `
          <button type="button" data-more-page="${i.page}">
            <svg aria-hidden="true"><use href="#${i.icon}"/></svg>
            <span>${UI.escapeHtml(i.label)}</span>
          </button>
        `).join('')}
        ${user ? `
          <button type="button" id="more-signout-btn">
            <svg aria-hidden="true"><use href="#icon-logout"/></svg>
            <span>Sign out</span>
          </button>
        ` : ''}
      </div>
    `;
    UI.openModal('More', body);
    document.querySelectorAll('[data-more-page]').forEach((btn) => {
      btn.addEventListener('click', () => {
        UI.closeModal();
        this.navigate(btn.dataset.morePage);
      });
    });
    const signoutBtn = document.getElementById('more-signout-btn');
    if (signoutBtn) {
      signoutBtn.addEventListener('click', () => {
        UI.closeModal();
        this.confirmSignOut();
      });
    }
  },

  openGlobalSearch() {
    const body = `
      <input type="search" id="global-search-input" class="guide-search" placeholder="Search transactions, goals, recurring, pages…" aria-label="Search everything" />
      <div id="global-search-results" class="search-results"></div>
    `;
    UI.openModal('Search', body);
    const input = document.getElementById('global-search-input');
    const resultsEl = document.getElementById('global-search-results');

    const PAGES = [
      { page: 'dashboard', icon: 'icon-home', label: 'Dashboard' },
      { page: 'transactions', icon: 'icon-receipt', label: 'Transactions' },
      { page: 'budget', icon: 'icon-target', label: 'Budget Planner' },
      { page: 'ptptn', icon: 'icon-cap', label: 'PTPTN/Scholarship Planning' },
      { page: 'savings', icon: 'icon-piggy', label: 'Savings Goals' },
      { page: 'analytics', icon: 'icon-chart', label: 'Analytics' },
      { page: 'settings', icon: 'icon-gear', label: 'Settings' },
      { page: 'guide', icon: 'icon-help', label: 'Guide' },
    ];

    const renderResults = (q) => {
      if (!q) { resultsEl.innerHTML = '<p class="form-hint" style="padding:4px 2px;">Start typing to search everything at once.</p>'; return; }
      const ql = q.toLowerCase();

      const txMatches = Store.getTransactions()
        .filter((t) => `${t.description || ''} ${t.category || ''} ${t.notes || ''}`.toLowerCase().includes(ql))
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
        .slice(0, 5);
      const goalMatches = Store.getGoals().filter((g) => g.name.toLowerCase().includes(ql)).slice(0, 5);
      const recMatches = Store.getRecurring().filter((r) => r.name.toLowerCase().includes(ql)).slice(0, 5);
      const pageMatches = PAGES.filter((p) => p.label.toLowerCase().includes(ql));

      const groups = [];
      if (pageMatches.length) groups.push({ title: 'Pages', items: pageMatches.map((p) => ({
        icon: p.icon, label: p.label, sub: '', action: () => this.navigate(p.page),
      })) });
      if (txMatches.length) groups.push({ title: 'Transactions', items: txMatches.map((t) => ({
        icon: t.type === 'income' ? (SOURCE_ICONS[t.category] || 'icon-more') : (CATEGORY_ICONS[t.category] || 'icon-more'),
        label: t.description || t.category,
        sub: `${t.type === 'income' ? '+' : '-'}${Calc.formatMoney(t.amount)} · ${Calc.formatDate(t.date)}`,
        action: () => { this.navigate('transactions'); this.openTransactionForm(t.type, t); },
      })) });
      if (goalMatches.length) groups.push({ title: 'Savings goals', items: goalMatches.map((g) => ({
        icon: 'icon-piggy', label: g.name, sub: `${Calc.formatMoney(g.saved)} of ${Calc.formatMoney(g.target)}`,
        action: () => this.navigate('savings'),
      })) });
      if (recMatches.length) groups.push({ title: 'Recurring expenses', items: recMatches.map((r) => ({
        icon: 'icon-repeat', label: r.name, sub: Calc.formatMoney(r.amount),
        action: () => this.navigate('settings'),
      })) });

      if (groups.length === 0) {
        resultsEl.innerHTML = '<p class="form-hint" style="padding:4px 2px;">No matches for that search.</p>';
        return;
      }
      resultsEl.innerHTML = groups.map((g) => `
        <div class="search-group">
          <div class="search-group__title">${UI.escapeHtml(g.title)}</div>
          ${g.items.map((it, i) => `
            <button type="button" class="search-result" data-group="${groups.indexOf(g)}" data-index="${i}">
              <svg aria-hidden="true"><use href="#${it.icon}"/></svg>
              <span class="search-result__text">
                <span class="search-result__label">${UI.escapeHtml(it.label)}</span>
                ${it.sub ? `<span class="search-result__sub">${UI.escapeHtml(it.sub)}</span>` : ''}
              </span>
            </button>
          `).join('')}
        </div>
      `).join('');

      resultsEl.querySelectorAll('.search-result').forEach((btn) => {
        const group = groups[Number(btn.dataset.group)];
        const item = group.items[Number(btn.dataset.index)];
        btn.addEventListener('click', () => {
          UI.closeModal();
          item.action();
        });
      });
    };

    renderResults('');
    input.addEventListener('input', () => renderResults(input.value.trim()));
  },

  timeGreeting() {
    const hour = Calc.getMYNow().getHours();
    if (hour < 12) return 'Good morning';
    if (hour < 18) return 'Good afternoon';
    return 'Good evening';
  },

  renderCurrentPage() {
    Charts.destroyAll();
    const renderers = {
      dashboard: () => this.renderDashboard(),
      transactions: () => this.renderTransactions(),
      budget: () => this.renderBudget(),
      ptptn: () => this.renderPtptn(),
      savings: () => this.renderSavings(),
      analytics: () => this.renderAnalytics(),
      settings: () => this.renderSettings(),
      guide: () => this.renderGuide(),
    };
    (renderers[this.state.page] || renderers.dashboard)();
  },

  // ================================================================
  // DASHBOARD
  // ================================================================
  renderDashboard() {
    const settings = Store.getSettings();
    const all = Store.getTransactions();
    const currentSemester = settings.currentSemester;
    const monthKey = Calc.currentMonthKey();

    const totalIncome = Calc.totalIncome(all);
    const totalExpense = Calc.totalExpense(all);
    const balance = totalIncome - totalExpense;

    const monthTx = Calc.filterByMonth(all, monthKey);
    const monthSpent = Calc.totalExpense(monthTx);
    const monthBudget = Calc.safeNumber(settings.monthlyBudget);
    const remainingMonthBudget = monthBudget - monthSpent;

    const semTx = Calc.filterBySemester(all, currentSemester);
    const semesterBalance = Calc.totalIncome(semTx) - Calc.totalExpense(semTx);

    const avgDaily = Calc.averageDailySpending(all);
    const txCount = all.length;

    const greeting = this.timeGreeting();

    const onboardingSteps = [
      { key: 'budget', label: t('onboard_budget'), done: Calc.safeNumber(settings.monthlyBudget) > 0 },
      { key: 'transaction', label: t('onboard_transaction'), done: all.length > 0 },
      { key: 'semester', label: t('onboard_semester'), done: !!(settings.semesterDates[currentSemester] && settings.semesterDates[currentSemester].start && settings.semesterDates[currentSemester].end) },
    ];

  statCard(label, value, tone) {
    const valClass = tone === 'income' ? 'stat-card__value--income' : tone === 'expense' ? 'stat-card__value--expense' : '';
    return `
      <div class="card stat-card">
        <span class="stat-card__label">${UI.escapeHtml(label)}</span>
        <span class="stat-card__value ${valClass}">${value}</span>
      </div>
    `;
  },

  // ---- accessible data-table alternative for a chart ----
  // headers: array of column labels; rows: array of arrays of cell text.
  buildDataTable(caption, headers, rows) {
    if (rows.length === 0) return '<p class="form-hint">No data for this chart yet.</p>';
    return `
      <table class="data-table chart-data-table">
        <caption class="sr-only">${UI.escapeHtml(caption)}</caption>
        <thead><tr>${headers.map((h) => `<th scope="col">${UI.escapeHtml(h)}</th>`).join('')}</tr></thead>
        <tbody>
          ${rows.map((r) => `<tr>${r.map((c, i) => i === 0 ? `<th scope="row">${UI.escapeHtml(c)}</th>` : `<td>${UI.escapeHtml(c)}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    `;
  },

  // wires a "Table" toggle button to show/hide the canvas vs. an accessible table.
  // call this AFTER the chart + table HTML both exist in the DOM.
  wireChartTableToggle(tableId) {
    const toggle = document.querySelector(`[data-table-target="${tableId}"]`);
    const tableWrap = document.getElementById(tableId);
    const canvasWrap = document.getElementById(tableId.replace(/-table$/, '-wrap'));
    if (!toggle || !tableWrap) return;
    toggle.addEventListener('click', () => {
      const showingTable = !tableWrap.hidden;
      tableWrap.hidden = showingTable;
      if (canvasWrap) canvasWrap.hidden = !showingTable;
      toggle.setAttribute('aria-pressed', String(!showingTable));
      toggle.classList.toggle('is-active', !showingTable);
    });
  },

  renderRunwayCard(container, settings, all, currentSemester) {
    const dates = settings.semesterDates[currentSemester];
    if (!dates || !dates.start || !dates.end) {
      container.innerHTML = `
        <p class="form-hint">Set your semester start/end dates to see your money runway.</p>
        <button class="btn btn--soft btn--sm" id="runway-set-dates">Set semester dates</button>
      `;
      container.querySelector('#runway-set-dates').addEventListener('click', () => this.openSemesterDatesForm(currentSemester));
      return;
    }
    const semTx = Calc.filterBySemester(all, currentSemester);
    const balance = Calc.totalIncome(semTx) - Calc.totalExpense(semTx);
    const avgDaily = Calc.averageDailySpending(semTx, dates.start);
    const runway = Calc.moneyRunway({
      semesterStart: dates.start, semesterEnd: dates.end,
      currentBalance: balance, avgDailySpending: avgDaily,
    });

    const statusLabel = { 'on-track': 'On track', 'careful': 'Be careful', 'at-risk': 'At risk', 'unknown': 'Not enough data' }[runway.status];

    const today = Calc.getMYNow();
    const start = new Date(dates.start);
    const end = new Date(dates.end);
    let pct = 50;
    if (!isNaN(start) && !isNaN(end) && end > start) {
      pct = Math.min(Math.max(((today - start) / (end - start)) * 100, 0), 100);
    }

    container.innerHTML = `
      <div class="runway-status">
        <span class="runway-status__dot runway-status__dot--${runway.status}"></span>
        <strong>${statusLabel}</strong>
        <span class="form-hint">${runway.daysRemaining !== null ? `${runway.daysRemaining} days left in ${UI.escapeHtml(currentSemester)}` : ''}</span>
      </div>
      <div class="card-grid" style="margin-bottom:6px;">
        ${this.statCard('Current avg. daily spending', Calc.formatMoney(runway.avgDailySpending))}
        ${this.statCard('Suggested max daily spending', runway.suggestedMaxDaily !== null ? Calc.formatMoney(runway.suggestedMaxDaily) : '—')}
        ${this.statCard('Estimated balance at semester end', runway.estimatedEndBalance !== null ? Calc.formatMoney(runway.estimatedEndBalance) : '—', runway.estimatedEndBalance < 0 ? 'expense' : '')}
      </div>
      <div class="timeline">
        <div class="timeline__track"></div>
        <div class="timeline__fill" style="width:${pct}%"></div>
        <div class="timeline__point" style="left:0%"></div>
        <div class="timeline__label" style="left:0%">Start</div>
        <div class="timeline__point timeline__point--today" style="left:${pct}%"></div>
        <div class="timeline__label" style="left:${pct}%">Today</div>
        <div class="timeline__point" style="left:100%"></div>
        <div class="timeline__label" style="left:100%; transform: translateX(-100%);">End</div>
      </div>
      <button class="btn btn--ghost btn--sm" id="runway-edit-dates" style="margin-top:10px;">Edit semester dates</button>
    `;
    container.querySelector('#runway-edit-dates').addEventListener('click', () => this.openSemesterDatesForm(currentSemester));
  },

  renderWarnings(container, settings, all, monthKey) {
    const warnings = this.computeWarnings(settings, all, monthKey);
    if (warnings.length === 0) {
      container.innerHTML = `<div class="card"><p class="form-hint" style="margin:0;">No warnings right now — you're on top of your spending. 🎉</p></div>`;
      return;
    }
    container.innerHTML = warnings.map((w) => `<div class="warning-item ${w.tone === 'info' ? 'warning-item--info' : ''}">${w.icon} <span>${w.text}</span></div>`).join('');
  },

  computeWarnings(settings, all, monthKey) {
    const warnings = [];
    const catBudgets = Store.getCategoryBudgets();
    const monthTx = Calc.filterByMonth(all, monthKey);
    const catTotalsThisMonth = Calc.categoryTotals(monthTx, 'expense');

    catBudgets.forEach((b) => {
      const spent = catTotalsThisMonth[b.category] || 0;
      const pct = Calc.budgetUsagePercent(spent, b.amount);
      if (pct >= 100) {
        warnings.push({ icon: '🚨', tone: 'warn', text: `You are over your ${UI.escapeHtml(b.category)} budget (${pct}% used).` });
      } else if (pct >= 80) {
        warnings.push({ icon: '⚠️', tone: 'warn', text: `You have used ${pct}% of your ${UI.escapeHtml(b.category)} budget.` });
      }
    });

    // overall monthly budget
    const monthSpent = Calc.totalExpense(monthTx);
    if (Calc.safeNumber(settings.monthlyBudget) > 0) {
      const pct = Calc.budgetUsagePercent(monthSpent, settings.monthlyBudget);
      if (pct >= 100) warnings.push({ icon: '🚨', tone: 'warn', text: 'You are over your monthly budget.' });
      else if (pct >= 85) warnings.push({ icon: '⚠️', tone: 'warn', text: `You have used ${pct}% of your monthly budget.` });
    }

    // compare to last month
    const d = Calc.getMYNow();
    const lastMonthDate = new Date(d.getFullYear(), d.getMonth() - 1, 1);
    const lastMonthKey = Calc.currentMonthKey(lastMonthDate);
    const lastMonthSpent = Calc.totalExpense(Calc.filterByMonth(all, lastMonthKey));
    if (lastMonthSpent > 0 && monthSpent > lastMonthSpent) {
      warnings.push({ icon: 'ℹ️', tone: 'info', text: 'Your spending this month is higher than last month.' });
    }

    // vs planned daily average using monthly budget
    const daysRemaining = Calc.daysRemainingInMonth(monthKey);
    const remaining = Calc.safeNumber(settings.monthlyBudget) - monthSpent;
    const suggestedLimit = Calc.dailySpendingLimit(remaining, daysRemaining);
    const todayStr = Calc.todayMYDateString();
    const todaySpent = Calc.totalExpense(monthTx.filter((t) => t.date === todayStr));
    if (suggestedLimit !== null && Calc.safeNumber(settings.monthlyBudget) > 0 && todaySpent > suggestedLimit) {
      warnings.push({ icon: '⚠️', tone: 'warn', text: 'You are spending more today than your suggested daily average.' });
    }

    return warnings;
  },

  renderDashboardBudgetProgress(container, settings, all, monthKey) {
    const catBudgets = Store.getCategoryBudgets();
    const monthTx = Calc.filterByMonth(all, monthKey);
    const spentByCat = Calc.categoryTotals(monthTx, 'expense');
    const monthBudget = Calc.safeNumber(settings.monthlyBudget);
    const monthSpent = Calc.totalExpense(monthTx);

    let html = this.budgetBarHtml('Overall monthly budget', monthSpent, monthBudget);
    if (catBudgets.length === 0) {
      html += `<p class="form-hint" style="margin-top:10px;">Set category budgets on the Budget page to see detailed progress here.</p>`;
    } else {
      html += catBudgets.map((b) => this.budgetBarHtml(b.category, spentByCat[b.category] || 0, b.amount)).join('');
    }
    container.innerHTML = html;
  },

  budgetBarHtml(name, spent, budget) {
    const pct = Calc.budgetUsagePercent(spent, budget);
    let cls = 'progress-fill--ok';
    if (pct >= 100) cls = 'progress-fill--over';
    else if (pct >= 80) cls = 'progress-fill--high';
    else if (pct >= 50) cls = 'progress-fill--mid';
    const barWidth = Math.min(pct, 100);
    return `
      <div class="budget-item">
        <div class="budget-item__top">
          <span class="budget-item__name">${UI.escapeHtml(name)}</span>
          <span class="budget-item__figures">${Calc.formatMoney(spent)} / ${budget > 0 ? Calc.formatMoney(budget) : 'no budget set'}</span>
        </div>
        <div class="progress-track"><div class="progress-fill ${cls}" style="width:${barWidth}%"></div></div>
        <div class="budget-item__pct">${pct}% used${pct >= 100 ? ' · over budget' : ''}</div>
      </div>
    `;
  },

  renderLast7DaysChart(all) {
    const days = [];
    const base = Calc.getMYNow();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() - i);
      const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      days.push({ dateStr, label: d.toLocaleDateString('en-MY', { weekday: 'short' }), full: d.toLocaleDateString('en-MY', { day: '2-digit', month: 'short' }) });
    }
    const data = days.map((d) => Calc.totalExpense(all.filter((t) => t.date === d.dateStr && t.type === 'expense')));
    Charts.monthlyBarChart('an-chart-last7', days.map((d) => d.label), data);
    document.getElementById('an-chart-last7-table').innerHTML = this.buildDataTable(
      'Spending for the last 7 days',
      ['Day', 'Amount'],
      days.map((d, i) => [`${d.label} (${d.full})`, Calc.formatMoney(data[i])]),
    );
    this.wireChartTableToggle('an-chart-last7-table');
  },

  renderOverviewChart(all) {
    const months = [];
    const d = Calc.getMYNow();
    for (let i = 5; i >= 0; i--) {
      const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
      months.push(Calc.currentMonthKey(dt));
    }
    const labels = months.map((m) => {
      const [y, mo] = m.split('-');
      return new Date(Number(y), Number(mo) - 1, 1).toLocaleDateString('en-MY', { month: 'short' });
    });
    const incomeData = months.map((m) => Calc.totalIncome(Calc.filterByMonth(all, m)));
    const expenseData = months.map((m) => Calc.totalExpense(Calc.filterByMonth(all, m)));
    Charts.spendingOverviewChart('chart-overview', labels, incomeData, expenseData);
    document.getElementById('chart-overview-table').innerHTML = this.buildDataTable(
      'Income and expenses by month, last 6 months',
      ['Month', 'Income', 'Expenses'],
      labels.map((l, i) => [l, Calc.formatMoney(incomeData[i]), Calc.formatMoney(expenseData[i])]),
    );
    this.wireChartTableToggle('chart-overview-table');
  },

  renderCategoryChartForMonth(all, monthKey) {
    const monthTx = Calc.filterByMonth(all, monthKey);
    const totals = Calc.categoryTotals(monthTx, 'expense');
    const entries = Object.entries(totals).sort((a, b) => b[1] - a[1]);
    const toggleBtn = document.querySelector('[data-table-target="chart-category-table"]');
    if (entries.length === 0) {
      document.getElementById('chart-category').closest('.chart-card__canvas-wrap').innerHTML = '<p class="form-hint">No expenses recorded this month yet.</p>';
      if (toggleBtn) toggleBtn.hidden = true;
      return;
    }
    Charts.categoryDoughnutChart('chart-category', entries.map((e) => e[0]), entries.map((e) => e[1]));
    const total = entries.reduce((sum, [, v]) => sum + v, 0);
    document.getElementById('chart-category-table').innerHTML = this.buildDataTable(
      'Spending by category this month',
      ['Category', 'Amount', '% of total'],
      entries.map(([cat, val]) => [cat, Calc.formatMoney(val), `${Math.round((val / total) * 100)}%`]),
    );
    this.wireChartTableToggle('chart-category-table');
  },

  // ================================================================
  // TRANSACTIONS

  renderTransactions() {

    const months = [...new Set(all.map((t) => Calc.monthKey(t.date)).filter(Boolean))].sort().reverse();

      <div class="filters-bar">

          <option value="income">Income only</option>

        <select id="tx-filter-category" aria-label="Filter by category">

    document.getElementById('tx-filter-category').value = f.category;
    document.getElementById('tx-filter-category').addEventListener('change', (e) => { f.category = e.target.value; this.renderTxTable(); });
    document.getElementById('tx-filter-month').value = f.month;
    document.getElementById('tx-filter-month').addEventListener('change', (e) => { f.month = e.target.value; this.renderTxTable(); });
    document.getElementById('tx-filter-semester').value = f.semester;
    document.getElementById('tx-filter-semester').addEventListener('change', (e) => { f.semester = e.target.value; this.renderTxTable(); });
    document.getElementById('tx-sort').value = f.sort;
    document.getElementById('tx-sort').addEventListener('change', (e) => { f.sort = e.target.value; this.renderTxTable(); });

    this.renderTxTable();
  },

  getFilteredTransactions() {
    const all = Store.getTransactions();
    const f = this.state.txFilters;
    let list = all.filter((t) => {
      if (f.type !== 'all' && t.type !== f.type) return false;
      if (f.category !== 'all' && t.category !== f.category) return false;
      if (f.month !== 'all' && Calc.monthKey(t.date) !== f.month) return false;
      if (f.semester !== 'all' && t.semester !== f.semester) return false;
      if (f.search) {
        const q = f.search.toLowerCase();
        const hay = `${t.description || ''} ${t.category || ''} ${t.notes || ''} ${t.paymentMethod || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const [sortKey, sortDir] = f.sort.split('-');
    list.sort((a, b) => {
      let cmp = 0;
      if (sortKey === 'date') cmp = (a.date || '').localeCompare(b.date || '');
      else cmp = Calc.safeNumber(a.amount) - Calc.safeNumber(b.amount);
      return sortDir === 'asc' ? cmp : -cmp;
    });
    return list;
  },

  renderTxTable() {
    const wrap = document.getElementById('tx-table-wrap');
    if (!wrap) return;
    const list = this.getFilteredTransactions();
    if (list.length === 0) {
      wrap.innerHTML = '';
      wrap.appendChild(UI.emptyState('No transactions match your filters yet.', 'Add expense', () => this.openTransactionForm('expense')));
      return;
    }
    wrap.innerHTML = `
      <table class="data-table">
        <thead><tr>
          <th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Method</th><th>Semester</th><th>Amount</th><th></th>
        </tr></thead>
        <tbody>
          ${list.map((t) => `
            <tr>
              <td>${Calc.formatDate(t.date)}</td>
              <td><span class="badge badge--${t.type}">${t.type === 'income' ? 'Income' : 'Expense'}</span></td>
              <td>${UI.escapeHtml(t.category || '—')}</td>
              <td>${UI.escapeHtml(t.description || '—')}</td>
              <td>${UI.escapeHtml(t.paymentMethod || '—')}</td>
              <td>${UI.escapeHtml(t.semester || '—')}</td>
              <td class="amount-cell ${t.type}">${t.type === 'income' ? '+' : '-'}${Calc.formatMoney(t.amount)}</td>
              <td>
                <div class="row-actions">
                  <button type="button" data-edit="${t.id}" aria-label="Edit"><svg aria-hidden="true"><use href="#icon-pencil"/></svg></button>
                  <button type="button" data-delete="${t.id}" aria-label="Delete"><svg aria-hidden="true"><use href="#icon-trash"/></svg></button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('[data-edit]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const tx = Store.getTransactions().find((t) => t.id === btn.dataset.edit);
        if (tx) this.openTransactionForm(tx.type, tx);
      });
    });
    wrap.querySelectorAll('[data-delete]').forEach((btn) => {
      btn.addEventListener('click', () => this.deleteTransactionWithUndo(btn.dataset.delete));
    });
  },

  deleteTransactionWithUndo(id) {
    const record = Store.getTransactions().find((t) => t.id === id);
    if (!record) return;
    Store.deleteTransaction(id);
    this.renderCurrentPage();
    UI.toast('Transaction deleted', 'success', {
      actionLabel: 'Undo',
      duration: 5000,
      onAction: () => {
        Store.restoreTransaction(record);
        UI.toast('Transaction restored', 'success');
        this.renderCurrentPage();
      },
    });
  },

  txRowHtml(t) {
    const iconId = t.type === 'income' ? (SOURCE_ICONS[t.category] || 'icon-more') : (CATEGORY_ICONS[t.category] || 'icon-more');
    return `
      <div class="tx-row">
        <div class="tx-row__left">
          <div class="tx-row__icon">${iconTag(iconId, 'tx-row__icon-svg')}</div>
          <div class="tx-row__info">
            <div class="tx-row__title">${UI.escapeHtml(t.description || t.category || 'Transaction')}</div>
            <div class="tx-row__meta">${UI.escapeHtml(t.category || '')} · ${Calc.formatDate(t.date)}</div>
          </div>
        </div>
        <div class="tx-row__amount ${t.type}">${t.type === 'income' ? '+' : '-'}${Calc.formatMoney(t.amount)}</div>
      </div>
    `;
  },

  // ---- transaction form ----
  openTransactionForm(type, existing, prefill) {
    const settings = Store.getSettings();
    const isEdit = !!existing;
    const data = existing || prefill || {};
    const categories = type === 'income' ? settings.incomeSources : settings.expenseCategories;

    const body = `
      <form id="tx-form">
        <div class="type-toggle">
          <button type="button" data-type="expense" class="${type === 'expense' ? 'is-active type-expense' : ''}"><svg aria-hidden="true"><use href="#icon-minus"/></svg>Expense</button>
          <button type="button" data-type="income" class="${type === 'income' ? 'is-active type-income' : ''}"><svg aria-hidden="true"><use href="#icon-plus"/></svg>Income</button>
        </div>
        <input type="hidden" id="tx-type" value="${type}" />
        <div class="form-grid">
          <div class="form-field">
            <label for="tx-amount">${t('field_amount')}</label>
            <input type="number" id="tx-amount" min="0" step="0.01" inputmode="decimal" value="${data.amount !== undefined ? data.amount : ''}" required />
          </div>
          <div class="form-field">
            <label for="tx-date">${t('field_date')}</label>
            <input type="date" id="tx-date" value="${data.date || Calc.todayMYDateString()}" required />
          </div>
          <div class="form-field form-field--full">
            <label for="tx-category" id="tx-category-label">${type === 'income' ? 'Source' : 'Category'}</label>
            <select id="tx-category"></select>
          </div>
          <div class="form-field form-field--full">
            <label for="tx-description">${t('field_description')}</label>
            <input type="text" id="tx-description" placeholder="e.g. Lunch at campus café" value="${UI.escapeHtml(data.description || '')}" />
          </div>
          <div class="form-field">
            <label for="tx-payment">${t('field_payment_method')}</label>
            <select id="tx-payment">
              ${PAYMENT_METHODS.map((p) => `<option value="${p}" ${data.paymentMethod === p ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
          </div>
          <div class="form-field">
            <label for="tx-semester">${t('field_semester')}</label>
            <select id="tx-semester">
              ${settings.semesters.map((s) => `<option value="${UI.escapeHtml(s)}" ${data.semester ? (data.semester === s ? 'selected' : '') : (settings.currentSemester === s ? 'selected' : '')}>${UI.escapeHtml(s)}</option>`).join('')}
            </select>
          </div>
          <div class="form-field form-field--full">
            <label for="tx-notes">${t('field_notes')}</label>
            <textarea id="tx-notes">${UI.escapeHtml(data.notes || '')}</textarea>
          </div>
        </div>
        <p class="form-error" id="tx-form-error"></p>
        <div class="modal-actions">
          ${isEdit ? '<button type="button" class="btn btn--danger" id="tx-delete-btn">Delete</button>' : ''}
          <button type="submit" class="btn btn--primary">${isEdit ? 'Save changes' : 'Add transaction'}</button>
        </div>
      </form>
    `;
    UI.openModal(isEdit ? 'Edit transaction' : (type === 'income' ? 'Add income' : 'Add expense'), body);

    const form = document.getElementById('tx-form');
    const typeInput = document.getElementById('tx-type');
    const categorySelect = document.getElementById('tx-category');
    const categoryLabel = document.getElementById('tx-category-label');

    const fillCategories = (txType) => {
      const list = txType === 'income' ? settings.incomeSources : settings.expenseCategories;
      categoryLabel.textContent = txType === 'income' ? t('field_source') : t('field_category');
      categorySelect.innerHTML = list.map((c) => `<option value="${UI.escapeHtml(c)}" ${data.category === c ? 'selected' : ''}>${UI.escapeHtml(c)}</option>`).join('');
    };
    fillCategories(type);

    form.querySelectorAll('.type-toggle button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const txType = btn.dataset.type;
        typeInput.value = txType;
        form.querySelectorAll('.type-toggle button').forEach((b) => b.classList.remove('is-active', 'type-expense', 'type-income'));
        btn.classList.add('is-active', txType === 'income' ? 'type-income' : 'type-expense');
        fillCategories(txType);
      });
    });

    if (isEdit) {
      document.getElementById('tx-delete-btn').addEventListener('click', () => {
        UI.closeModal();
        this.deleteTransactionWithUndo(existing.id);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = Number(document.getElementById('tx-amount').value);
      const date = document.getElementById('tx-date').value;
      const errorEl = document.getElementById('tx-form-error');
      if (!amount || amount <= 0) { errorEl.textContent = 'Please enter an amount greater than 0.'; return; }
      if (!date) { errorEl.textContent = 'Please pick a date.'; return; }

      const record = {
        type: typeInput.value,
        amount,
        date,
        category: categorySelect.value,
        description: document.getElementById('tx-description').value.trim(),
        paymentMethod: document.getElementById('tx-payment').value,
        semester: document.getElementById('tx-semester').value,
        notes: document.getElementById('tx-notes').value.trim(),
      };

      const saveIt = () => {
        if (isEdit) {
          Store.updateTransaction(existing.id, record);
          UI.toast('Transaction updated', 'success');
        } else {
          Store.addTransaction(record);
          UI.toast(`${record.type === 'income' ? 'Income' : 'Expense'} added`, 'success');
        }
        UI.closeModal();
        this.renderCurrentPage();
      };

      const duplicate = Store.getTransactions().find((t) =>
        t.id !== (existing && existing.id) && t.type === record.type && t.date === record.date &&
        t.category === record.category && Calc.safeNumber(t.amount) === record.amount);

      if (duplicate) {
        UI.confirm(
          `You already have a ${Calc.formatMoney(record.amount)} ${UI.escapeHtml(record.category)} transaction on ${Calc.formatDate(record.date)}${duplicate.description ? ` ("${UI.escapeHtml(duplicate.description)}")` : ''}. Add this one too?`,
          saveIt,
          { title: 'This looks like a duplicate', confirmLabel: 'Add anyway' },
        );
      } else {
        saveIt();
      }
    });
  },

  // ================================================================
  // BUDGET PLANNER
  // ================================================================
  renderBudget() {
    const settings = Store.getSettings();
    const all = Store.getTransactions();
    const monthKey = Calc.currentMonthKey();
    const monthTx = Calc.filterByMonth(all, monthKey);
    const monthSpent = Calc.totalExpense(monthTx);
    const spentByCat = Calc.categoryTotals(monthTx, 'expense');
    const catBudgets = Store.getCategoryBudgets();
    const semTx = Calc.filterBySemester(all, settings.currentSemester);
    const semSpent = Calc.totalExpense(semTx);
    const semBudget = Calc.safeNumber(settings.semesterBudgets[settings.currentSemester]);

    this.el.innerHTML = `
      <div class="two-col">
        <div class="card">
          <div class="section-title" style="margin-top:0;"><h2>Monthly budget</h2>
            <button class="btn btn--soft btn--sm" id="edit-monthly-budget">Edit</button>
          </div>
          ${this.budgetBarHtml('This month', monthSpent, Calc.safeNumber(settings.monthlyBudget))}
        </div>
        <div class="card">
          <div class="section-title" style="margin-top:0;"><h2>${UI.escapeHtml(settings.currentSemester)} budget</h2>
            <button class="btn btn--soft btn--sm" id="edit-semester-budget">Edit</button>
          </div>
          ${this.budgetBarHtml(settings.currentSemester, semSpent, semBudget)}
        </div>
      </div>

      <div class="section-title">
        <h2>Category budgets (monthly)</h2>
        <button class="btn btn--primary btn--sm" id="add-category-budget">+ Set category budget</button>
      </div>
      <div class="card" id="category-budgets-wrap"></div>
    `;

    document.getElementById('edit-monthly-budget').addEventListener('click', () => this.openMonthlyBudgetForm());
    document.getElementById('edit-semester-budget').addEventListener('click', () => this.openSemesterBudgetForm(settings.currentSemester));
    document.getElementById('add-category-budget').addEventListener('click', () => this.openCategoryBudgetForm());

    const wrap = document.getElementById('category-budgets-wrap');
    if (catBudgets.length === 0) {
      wrap.appendChild(UI.emptyState('No category budgets yet. Set one for Food, Transport, or any category you want to control.', 'Set category budget', () => this.openCategoryBudgetForm()));
    } else {
      wrap.innerHTML = catBudgets
        .slice()
        .sort((a, b) => a.category.localeCompare(b.category))
        .map((b) => {
          const spent = spentByCat[b.category] || 0;
          const pct = Calc.budgetUsagePercent(spent, b.amount);
          let cls = 'progress-fill--ok';
          if (pct >= 100) cls = 'progress-fill--over';
          else if (pct >= 80) cls = 'progress-fill--high';
          else if (pct >= 50) cls = 'progress-fill--mid';
          return `
            <div class="budget-item">
              <div class="budget-item__top">
                <span class="budget-item__name">${iconTag(CATEGORY_ICONS[b.category] || 'icon-more', 'inline-icon')}${UI.escapeHtml(b.category)}</span>
                <div class="row-actions">
                  <button type="button" data-edit-budget="${UI.escapeHtml(b.category)}" aria-label="Edit"><svg aria-hidden="true"><use href="#icon-pencil"/></svg></button>
                  <button type="button" data-delete-budget="${UI.escapeHtml(b.category)}" aria-label="Delete"><svg aria-hidden="true"><use href="#icon-trash"/></svg></button>
                </div>
              </div>
              <div class="budget-item__figures">${Calc.formatMoney(spent)} / ${Calc.formatMoney(b.amount)}</div>
              <div class="progress-track"><div class="progress-fill ${cls}" style="width:${Math.min(pct, 100)}%"></div></div>
              <div class="budget-item__pct">${pct}% used${pct >= 100 ? ' · over budget' : ''}</div>
            </div>
          `;
        }).join('');
      wrap.querySelectorAll('[data-edit-budget]').forEach((btn) => {
        btn.addEventListener('click', () => this.openCategoryBudgetForm(btn.dataset.editBudget));
      });
      wrap.querySelectorAll('[data-delete-budget]').forEach((btn) => {
        btn.addEventListener('click', () => {
          UI.confirm(`Remove the budget for ${btn.dataset.deleteBudget}?`, () => {
            Store.setCategoryBudget(btn.dataset.deleteBudget, null);
            UI.toast('Category budget removed', 'success');
            this.renderCurrentPage();
          });
        });
      });
    }
  },

  openCategoryBudgetForm(existingCategory) {
    const settings = Store.getSettings();
    const catBudgets = Store.getCategoryBudgets();

          <select id="cat-budget-category" ${existing ? 'disabled' : ''}>

        <div class="form-field">
          <label for="cat-budget-amount">Monthly budget (RM)</label>
          <input type="number" id="cat-budget-amount" min="0" step="0.01" value="${existing ? existing.amount : ''}" required />
        </div>
        <div class="modal-actions"><button type="submit" class="btn btn--primary">Save</button></div>
      </form>
    `;

      e.preventDefault();
      const category = existing ? existing.category : document.getElementById('cat-budget-category').value;
      const amount = Number(document.getElementById('cat-budget-amount').value) || 0;
      Store.setCategoryBudget(category, amount);
      UI.closeModal();
      UI.toast('Category budget saved', 'success');
      this.renderCurrentPage();
    });

    const settings = Store.getSettings();
    const plans = Store.getPtptnPlans().slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    this.el.innerHTML = `

    `;

    const listEl = document.getElementById('ptptn-list');
    if (plans.length === 0) {
      listEl.appendChild(UI.emptyState('No PTPTN/Scholarship plans yet. Record what you received and plan how to allocate it.', 'Add money received', () => this.openPtptnForm()));
      return;
    }

    listEl.innerHTML = plans.map((p) => {
      const allocated = Object.values(p.allocations || {}).reduce((a, b) => a + Calc.safeNumber(b), 0);
      const unallocated = Calc.safeNumber(p.amount) - allocated;
      const pct = Calc.safeNumber(p.amount) > 0 ? Math.round((allocated / p.amount) * 100) : 0;
      return `
        <div class="card" style="margin-bottom:14px;">
          <div class="budget-item__top">
            <div>

  openPtptnAllocationForm(planId) {
    const settings = Store.getSettings();
    const plan = Store.getPtptnPlans().find((p) => p.id === planId);
    if (!plan) return;
    const allocations = { ...(plan.allocations || {}) };

    const body = `
      <form id="alloc-form">
        <p class="form-hint">Total received: <strong>${Calc.formatMoney(plan.amount)}</strong>. This is a plan only — it won't be counted as spending.</p>
        ${settings.expenseCategories.concat(['Savings']).map((cat) => `
          <div class="alloc-row">
            <span class="alloc-row__label">${iconTag(CATEGORY_ICONS[cat] || 'icon-piggy', 'inline-icon')}${UI.escapeHtml(cat)}</span>
            <input type="number" min="0" step="0.01" data-alloc-cat="${UI.escapeHtml(cat)}" value="${allocations[cat] || ''}" placeholder="0.00" />
          </div>
        `).join('')}
        <p class="form-error" id="alloc-error"></p>
        <p id="alloc-summary" class="form-hint"></p>
        <div class="modal-actions"><button type="submit" class="btn btn--primary">Save allocation</button></div>
      </form>
    `;
    UI.openModal('Allocate PTPTN/Scholarship money', body);

    const form = document.getElementById('alloc-form');
    const inputs = form.querySelectorAll('[data-alloc-cat]');
    const summaryEl = document.getElementById('alloc-summary');
    const updateSummary = () => {
      let total = 0;
      inputs.forEach((i) => { total += Number(i.value) || 0; });
      const remaining = Calc.safeNumber(plan.amount) - total;
      summaryEl.textContent = `Allocated: ${Calc.formatMoney(total)} · Remaining: ${Calc.formatMoney(remaining)}`;
      summaryEl.style.color = remaining < 0 ? 'var(--expense)' : '';
    };
    inputs.forEach((i) => i.addEventListener('input', updateSummary));
    updateSummary();

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const newAllocations = {};
      let total = 0;
      inputs.forEach((i) => {
        const val = Number(i.value) || 0;
        if (val > 0) newAllocations[i.dataset.allocCat] = val;
        total += val;
      });
      if (total > plan.amount) {
        document.getElementById('alloc-error').textContent = `You've allocated ${Calc.formatMoney(total - plan.amount)} more than you received.`;
        return;
      }
      Store.updatePtptnPlan(plan.id, { allocations: newAllocations });
      UI.closeModal();
      UI.toast('Allocation saved', 'success');
      this.renderCurrentPage();
    });
  },

  renderAnalytics() {
    const settings = Store.getSettings();
    const all = Store.getTransactions();
    const f = this.state.analyticsFilters;

    const months = [...new Set(all.map((t) => Calc.monthKey(t.date)).filter(Boolean))].sort().reverse();
    const categories = [...new Set(all.filter((t) => t.type === 'expense').map((t) => t.category).filter(Boolean))].sort();

        <select id="an-filter-semester"><option value="all">All semesters</option>${settings.semesters.map((s) => `<option value="${UI.escapeHtml(s)}">${UI.escapeHtml(s)}</option>`).join('')}</select>
        <select id="an-filter-category"><option value="all">All categories</option>${categories.map((c) => `<option value="${UI.escapeHtml(c)}">${UI.escapeHtml(c)}</option>`).join('')}</select>
      </div>
      <div class="card-grid" id="an-stats"></div>

      <div class="section-title"><h2><svg class="section-title__icon" aria-hidden="true"><use href="#icon-star"/></svg>${t('dash_daily_recap')}</h2></div>
      <div id="an-daily-recap-wrap"></div>
      <div class="card chart-card" style="margin-bottom:20px;">
        <div class="chart-card__header">
          <h3>Last 7 days</h3>
          <button type="button" class="chart-table-toggle" data-table-target="an-chart-last7-table">${iconTag('icon-receipt', '')}Table</button>
        </div>
        <div class="chart-card__canvas-wrap" id="an-chart-last7-wrap"><canvas id="an-chart-last7"></canvas></div>
        <div class="chart-data-table-wrap" id="an-chart-last7-table" hidden></div>
      </div>

      <div class="section-title"><h2><svg class="section-title__icon" aria-hidden="true"><use href="#icon-star"/></svg>This month's recap</h2></div>
      <div id="an-recap-wrap"></div>

      <div class="two-col">
        <div class="card chart-card">
          <div class="chart-card__header">
            <h3>Monthly spending</h3>
            <button type="button" class="chart-table-toggle" data-table-target="an-chart-monthly-table">${iconTag('icon-receipt', '')}Table</button>
          </div>
          <div class="chart-card__canvas-wrap" id="an-chart-monthly-wrap"><canvas id="an-chart-monthly"></canvas></div>
          <div class="chart-data-table-wrap" id="an-chart-monthly-table" hidden></div>
        </div>
        <div class="card chart-card">
          <div class="chart-card__header">
            <h3>Spending by category</h3>
            <button type="button" class="chart-table-toggle" data-table-target="an-chart-category-table">${iconTag('icon-receipt', '')}Table</button>
          </div>
          <div class="chart-card__canvas-wrap" id="an-chart-category-wrap"><canvas id="an-chart-category"></canvas></div>
          <div class="chart-data-table-wrap" id="an-chart-category-table" hidden></div>
        </div>
      </div>
      <div class="card chart-card" style="margin-top:16px;">
        <div class="chart-card__header">
          <h3>Income vs expenses</h3>
          <button type="button" class="chart-table-toggle" data-table-target="an-chart-income-expense-table">${iconTag('icon-receipt', '')}Table</button>
        </div>
        <div class="chart-card__canvas-wrap" id="an-chart-income-expense-wrap"><canvas id="an-chart-income-expense"></canvas></div>
        <div class="chart-data-table-wrap" id="an-chart-income-expense-table" hidden></div>
      </div>
    `;

    document.getElementById('an-filter-month').value = f.month;
    document.getElementById('an-filter-month').addEventListener('change', (e) => { f.month = e.target.value; this.renderAnalytics(); });
    document.getElementById('an-filter-semester').value = f.semester;
    document.getElementById('an-filter-semester').addEventListener('change', (e) => { f.semester = e.target.value; this.renderAnalytics(); });
    document.getElementById('an-filter-category').value = f.category;
    document.getElementById('an-filter-category').addEventListener('change', (e) => { f.category = e.target.value; this.renderAnalytics(); });

    let filtered = all;
    if (f.month !== 'all') filtered = filtered.filter((t) => Calc.monthKey(t.date) === f.month);
    if (f.semester !== 'all') filtered = filtered.filter((t) => t.semester === f.semester);
    if (f.category !== 'all') filtered = filtered.filter((t) => t.category === f.category);

    const expenseTx = filtered.filter((t) => t.type === 'expense');
    const catTotals = Calc.categoryTotals(filtered, 'expense');
    const topCat = Calc.highestCategory(catTotals);
    const monthTotals = Calc.monthlyTotals(filtered, 'expense');
    const monthEntries = Object.entries(monthTotals).sort((a, b) => a[0].localeCompare(b[0]));
    const topMonth = monthEntries.reduce((best, cur) => (!best || cur[1] > best[1] ? cur : best), null);
    const avgDaily = Calc.averageDailySpending(filtered);
    const avgMonthly = monthEntries.length > 0 ? monthEntries.reduce((a, [, v]) => a + v, 0) / monthEntries.length : 0;

    document.getElementById('an-stats').innerHTML = [
      this.statCard('Total spending', Calc.formatMoney(Calc.totalExpense(filtered)), 'expense'),
      this.statCard('Total income', Calc.formatMoney(Calc.totalIncome(filtered)), 'income'),
      this.statCard('Highest category', topCat ? `${topCat.category} (${Calc.formatMoney(topCat.amount)})` : '—'),
      this.statCard('Highest month', topMonth ? topMonth[0] : '—'),
      this.statCard('Average daily spending', Calc.formatMoney(avgDaily)),
      this.statCard('Average monthly spending', Calc.formatMoney(avgMonthly)),
    ].join('');

    // monthly bar chart
    const monthlyToggle = document.querySelector('[data-table-target="an-chart-monthly-table"]');
    if (monthEntries.length === 0) {
      document.getElementById('an-chart-monthly').closest('.chart-card__canvas-wrap').innerHTML = '<p class="form-hint">No spending data for this filter yet.</p>';
      if (monthlyToggle) monthlyToggle.hidden = true;
    } else {
      Charts.monthlyBarChart('an-chart-monthly', monthEntries.map((e) => e[0]), monthEntries.map((e) => e[1]));
      if (monthlyToggle) monthlyToggle.hidden = false;
      document.getElementById('an-chart-monthly-table').innerHTML = this.buildDataTable(
        'Spending by month', ['Month', 'Amount'],
        monthEntries.map(([m, v]) => [m, Calc.formatMoney(v)]),
      );
      this.wireChartTableToggle('an-chart-monthly-table');
    }

    // category doughnut
    const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
    const catToggle = document.querySelector('[data-table-target="an-chart-category-table"]');
    if (catEntries.length === 0) {
      document.getElementById('an-chart-category').closest('.chart-card__canvas-wrap').innerHTML = '<p class="form-hint">No expenses recorded for this filter yet.</p>';
      if (catToggle) catToggle.hidden = true;
    } else {
      Charts.categoryDoughnutChart('an-chart-category', catEntries.map((e) => e[0]), catEntries.map((e) => e[1]));
      if (catToggle) catToggle.hidden = false;
      const catTotal = catEntries.reduce((sum, [, v]) => sum + v, 0);
      document.getElementById('an-chart-category-table').innerHTML = this.buildDataTable(
        'Spending by category', ['Category', 'Amount', '% of total'],
        catEntries.map(([cat, val]) => [cat, Calc.formatMoney(val), `${Math.round((val / catTotal) * 100)}%`]),
      );
      this.wireChartTableToggle('an-chart-category-table');
    }

    // income vs expense by month (last 6 available or filtered months)
    const ieMonths = monthEntries.length > 0 ? monthEntries.map((e) => e[0]) : [];
    const ieToggle = document.querySelector('[data-table-target="an-chart-income-expense-table"]');
    if (ieMonths.length === 0) {
      document.getElementById('an-chart-income-expense').closest('.chart-card__canvas-wrap').innerHTML = '<p class="form-hint">No data for this filter yet.</p>';
      if (ieToggle) ieToggle.hidden = true;
    } else {
      const incomeByMonth = ieMonths.map((m) => Calc.totalIncome(filtered.filter((t) => Calc.monthKey(t.date) === m)));
      const expenseByMonth = ieMonths.map((m) => Calc.totalExpense(filtered.filter((t) => Calc.monthKey(t.date) === m)));
      Charts.incomeVsExpenseChart('an-chart-income-expense', ieMonths, incomeByMonth, expenseByMonth);
      if (ieToggle) ieToggle.hidden = false;
      document.getElementById('an-chart-income-expense-table').innerHTML = this.buildDataTable(
        'Income vs expenses by month', ['Month', 'Income', 'Expenses'],
        ieMonths.map((m, i) => [m, Calc.formatMoney(incomeByMonth[i]), Calc.formatMoney(expenseByMonth[i])]),
      );
      this.wireChartTableToggle('an-chart-income-expense-table');
    }

    this.renderDailyRecap(document.getElementById('an-daily-recap-wrap'), all);
    this.renderLast7DaysChart(all);
    this.renderMonthlyRecap(document.getElementById('an-recap-wrap'), all);
  },
