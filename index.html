  renderDailyRecap(container, all) {
    if (!container) return;
    const todayStr = Calc.todayMYDateString();
    const yesterdayDate = new Date(Calc.getMYNow());
    yesterdayDate.setDate(yesterdayDate.getDate() - 1);
    const yesterdayStr = `${yesterdayDate.getFullYear()}-${String(yesterdayDate.getMonth() + 1).padStart(2, '0')}-${String(yesterdayDate.getDate()).padStart(2, '0')}`;

    const todayTx = all.filter((t) => t.date === todayStr);
    const yesterdayTx = all.filter((t) => t.date === yesterdayStr);
    const todaySpent = Calc.totalExpense(todayTx);
    const yesterdaySpent = Calc.totalExpense(yesterdayTx);
    const avgDaily = Calc.averageDailySpending(all);

    if (all.length === 0) {
      container.innerHTML = `<div class="card"><p class="form-hint" style="margin:0;">Add a transaction to see today's recap here.</p></div>`;
      return;
    }

    const insights = [];

    if (todaySpent === 0) {
      insights.push({ tone: 'positive', text: "No spending logged today yet — nice and quiet." });
    } else {
      insights.push({ tone: 'info', text: `You've spent ${Calc.formatMoney(todaySpent)} today so far.` });

      if (yesterdaySpent > 0) {
        const pct = Math.round(((todaySpent - yesterdaySpent) / yesterdaySpent) * 100);
        if (pct <= -5) insights.push({ tone: 'positive', text: `That's ${Math.abs(pct)}% less than yesterday (${Calc.formatMoney(yesterdaySpent)}).` });
        else if (pct >= 5) insights.push({ tone: 'info', text: `That's ${pct}% more than yesterday (${Calc.formatMoney(yesterdaySpent)}).` });
        else insights.push({ tone: 'info', text: `That's about the same as yesterday (${Calc.formatMoney(yesterdaySpent)}).` });
      }

      if (avgDaily > 0) {
        const diffPct = Math.round(((todaySpent - avgDaily) / avgDaily) * 100);
        if (diffPct <= -10) insights.push({ tone: 'positive', text: `You're ${Math.abs(diffPct)}% below your usual average daily spending (${Calc.formatMoney(avgDaily)}).` });
        else if (diffPct >= 10) insights.push({ tone: 'info', text: `You're ${diffPct}% above your usual average daily spending (${Calc.formatMoney(avgDaily)}).` });
      }

      const todayExpenseTx = todayTx.filter((t) => t.type === 'expense');
      if (todayExpenseTx.length > 0) {
        const biggest = todayExpenseTx.reduce((max, t) => (Calc.safeNumber(t.amount) > Calc.safeNumber(max.amount) ? t : max), todayExpenseTx[0]);
        insights.push({ tone: 'info', text: `Your biggest expense today was ${UI.escapeHtml(biggest.description || biggest.category)} — ${Calc.formatMoney(biggest.amount)}.` });
      }
    }

    container.innerHTML = `<div class="card">${insights.map((i) => `
      <div class="warning-item ${i.tone === 'positive' ? 'warning-item--positive' : 'warning-item--info'}">
        ${iconTag(i.tone === 'positive' ? 'icon-check' : 'icon-chart', '')}
        <span>${i.text}</span>
      </div>
    `).join('')}</div>`;
  },

  renderMonthlyRecap(container, all) {
    if (!container) return;
    const today = Calc.getMYNow();
    const thisMonthKey = Calc.currentMonthKey(today);
    const lastMonthDate = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    const lastMonthKey = Calc.currentMonthKey(lastMonthDate);

    const thisMonthTx = Calc.filterByMonth(all, thisMonthKey);
    const lastMonthTx = Calc.filterByMonth(all, lastMonthKey);
    const thisSpent = Calc.totalExpense(thisMonthTx);
    const lastSpent = Calc.totalExpense(lastMonthTx);
    const thisIncome = Calc.totalIncome(thisMonthTx);

    if (thisMonthTx.length === 0 && lastMonthTx.length === 0) {
      container.innerHTML = `<div class="card"><p class="form-hint" style="margin:0;">Add a few transactions this month and last month to see a recap here.</p></div>`;
      return;
    }

    const insights = [];

    // overall spending trend
    if (lastSpent > 0) {
      const pct = Math.round(((thisSpent - lastSpent) / lastSpent) * 100);
      if (pct <= -5) insights.push({ tone: 'positive', text: `You've spent ${Math.abs(pct)}% less this month than last (${Calc.formatMoney(thisSpent)} vs ${Calc.formatMoney(lastSpent)}).` });
      else if (pct >= 5) insights.push({ tone: 'info', text: `You've spent ${pct}% more this month than last (${Calc.formatMoney(thisSpent)} vs ${Calc.formatMoney(lastSpent)}).` });
      else insights.push({ tone: 'info', text: `Your spending is about the same as last month (${Calc.formatMoney(thisSpent)} vs ${Calc.formatMoney(lastSpent)}).` });
    } else if (thisSpent > 0) {
      insights.push({ tone: 'info', text: `You've spent ${Calc.formatMoney(thisSpent)} so far this month.` });
    }

    // biggest category this month
    const thisCatTotals = Calc.categoryTotals(thisMonthTx, 'expense');
    const topCat = Calc.highestCategory(thisCatTotals);
    if (topCat && thisSpent > 0) {
      const share = Math.round((topCat.amount / thisSpent) * 100);
      insights.push({ tone: 'info', text: `${UI.escapeHtml(topCat.category)} is your biggest category this month — ${Calc.formatMoney(topCat.amount)} (${share}% of your spending).` });
    }

    // category with the biggest RM increase vs last month
    const lastCatTotals = Calc.categoryTotals(lastMonthTx, 'expense');
    let biggestIncrease = null;
    Object.entries(thisCatTotals).forEach(([cat, amt]) => {
      const diff = amt - (lastCatTotals[cat] || 0);
      if (!biggestIncrease || diff > biggestIncrease.diff) biggestIncrease = { cat, diff, amt, prev: lastCatTotals[cat] || 0 };
    });
    if (biggestIncrease && biggestIncrease.diff > 0 && biggestIncrease.prev > 0) {
      insights.push({ tone: 'info', text: `${UI.escapeHtml(biggestIncrease.cat)} spending is up ${Calc.formatMoney(biggestIncrease.diff)} compared to last month.` });
    }

    // savings rate
    if (thisIncome > 0) {
      const savingsRate = Math.round(((thisIncome - thisSpent) / thisIncome) * 100);
      if (savingsRate >= 0) insights.push({ tone: 'positive', text: `You've kept ${savingsRate}% of what you received this month unspent so far.` });
      else insights.push({ tone: 'info', text: `You've spent more than you've received this month (${Calc.formatMoney(thisSpent)} vs ${Calc.formatMoney(thisIncome)}).` });
    }

    // budget discipline
    const catBudgets = Store.getCategoryBudgets();
    if (catBudgets.length > 0) {
      const overBudget = catBudgets.filter((b) => (thisCatTotals[b.category] || 0) > b.amount);
      if (overBudget.length === 0) insights.push({ tone: 'positive', text: `You're within budget on all ${catBudgets.length} of your tracked categories this month. Nice.` });
      else insights.push({ tone: 'info', text: `You're over budget on ${overBudget.length} categor${overBudget.length === 1 ? 'y' : 'ies'}: ${overBudget.map((b) => UI.escapeHtml(b.category)).join(', ')}.` });
    }

    if (insights.length === 0) {
      container.innerHTML = `<div class="card"><p class="form-hint" style="margin:0;">Not enough data yet for a recap — check back once you've logged more transactions.</p></div>`;
      return;
    }

    container.innerHTML = `<div class="card">${insights.map((i) => `
      <div class="warning-item ${i.tone === 'positive' ? 'warning-item--positive' : 'warning-item--info'}">
        ${iconTag(i.tone === 'positive' ? 'icon-check' : 'icon-chart', '')}
        <span>${i.text}</span>
      </div>
    `).join('')}</div>`;
  },

          <p>Charts for understanding your spending over time, plus two auto-generated recaps: <strong>Today's recap</strong> (with a "Last 7 days" chart) and <strong>this month's recap</strong> — comparisons like "you spent 20% less than last month," computed from your real data.</p>
          <p>Every chart has a <strong>"Table"</strong> button next to it that swaps the chart for the same numbers as a plain table — handy if you'd rather read numbers than a graph.</p>
          <p>Use the filters at the top to narrow the main charts to a specific month, semester, or category. Your highest-spending category and month are called out automatically.</p>
        `,
      },
      {
        icon: 'icon-search', title: 'Search everything',
        body: `
          <p>Tap the magnifying-glass icon in the top bar (any page, any device) to search across your transactions, savings goals, recurring expenses, and page names all at once.</p>
          <p>Tapping a transaction result jumps straight into editing it; tapping a page result navigates there.</p>
        `,
      },
      {
        icon: 'icon-repeat', title: 'Recurring expenses & semesters',
        body: `
          <p><strong>Recurring expenses</strong> (Settings page) are for bills that repeat, like your phone plan or hostel internet. Tap <strong>"Mark as paid"</strong> on one to open a pre-filled expense form — just confirm the date and amount, since it can vary slightly month to month.</p>
          <p><strong>Semester management</strong> (also in Settings) lets you see each semester's totals, switch which one is "current" (the semester picker at the top of every page), set each semester's start/end dates for the Money Runway feature, and <strong>print a summary</strong> — a clean, black-and-white page with totals, a category breakdown, and every transaction, useful for records like financial aid documentation.</p>
        `,
      },
      {
        icon: 'icon-cloud', title: 'Google sign-in & cloud sync',
        body: `
          <p>Optional. If it's been set up for this site, signing in with Google keeps the exact same data in sync across every device you sign into — add an expense on your phone, see it instantly on your laptop.</p>
          <p>The status pill near the top shows <strong>Synced</strong>, <strong>Syncing…</strong>, <strong>Offline</strong>, or <strong>Sync error</strong>. The app keeps working from its local copy even while offline, and catches up once you're back online.</p>
          <p>Signing in for the first time with existing data already on your device? You'll be asked whether to import it into your account or start fresh.</p>
        `,
      },
      {
        icon: 'icon-gear', title: 'Settings & backups',
        body: `
          <p><strong>Export data (JSON)</strong> downloads everything as a backup file — keep one occasionally even if you use cloud sync. <strong>Import backup (JSON)</strong> restores from one. <strong>Export transactions (CSV)</strong> is for opening your transactions in a spreadsheet.</p>
          <p><strong>Dark mode</strong> can be toggled from the sidebar (desktop) or the small circular button in the top bar (mobile).</p>
          <p><strong>Language</strong> — switch between English and Bahasa Melayu from Settings → Preferences. Covers navigation, the Dashboard, and common buttons/fields; some longer content stays in English for now.</p>
          <p>On mobile, the bottom bar's <strong>More</strong> button opens PTPTN/Scholarship, Savings, Settings and this Guide — everything that doesn't fit in the five main tabs.</p>
          <p>Under Settings → <strong>Install as an app</strong>, you can add Duit Kira to your home screen so it opens full-screen, like a real app, with no browser bar.</p>
        `,
      },
    ];

    this.el.innerHTML = `
      <div class="card guide-intro">
        <p>Everything below is expandable — tap a topic to open it. Use the search box to jump straight to what you need.</p>
        <input type="search" id="guide-search" class="guide-search" placeholder="Search the guide… e.g. 'budget' or 'sync'" aria-label="Search the guide" />
      </div>
      <div class="guide-list" id="guide-list">
        ${sections.map((s, i) => `
          <details class="guide-item" data-guide-index="${i}" ${s.open ? 'open' : ''}>
            <summary class="guide-item__summary">
              <svg class="guide-item__icon" aria-hidden="true"><use href="#${s.icon}"/></svg>
              <span class="guide-item__title">${UI.escapeHtml(s.title)}</span>
              <svg class="guide-item__chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>
            </summary>
            <div class="guide-item__body">${s.body}</div>
          </details>
        `).join('')}
      </div>
      <p class="guide-empty form-hint" id="guide-no-results" hidden>No topics match your search.</p>
      <p class="app-watermark">Created by : <a href="https://t.me/fdhislhhh" target="_blank" rel="noopener noreferrer">@fdhislhhh</a> on tg</p>
    `;

    const searchInput = document.getElementById('guide-search');
    const items = [...document.querySelectorAll('.guide-item')];
    const noResults = document.getElementById('guide-no-results');
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      let visibleCount = 0;
      items.forEach((item) => {
        const text = item.textContent.toLowerCase();
        const matches = !q || text.includes(q);
        item.hidden = !matches;
        if (matches) {
          visibleCount++;
          if (q) item.open = true;
        }
      });
      noResults.hidden = visibleCount > 0;
    });
  },

  openSemesterDatesForm(semester) {
    const settings = Store.getSettings();
    const dates = settings.semesterDates[semester] || {};
    const body = `
      <form id="sem-dates-form">
        <div class="form-field">
          <label for="sem-start">${UI.escapeHtml(semester)} start date</label>
          <input type="date" id="sem-start" value="${dates.start || ''}" required />
        </div>
        <div class="form-field">
          <label for="sem-end">${UI.escapeHtml(semester)} end date</label>
          <input type="date" id="sem-end" value="${dates.end || ''}" required />
        </div>
        <p class="form-error" id="sem-dates-error"></p>
        <div class="modal-actions"><button type="submit" class="btn btn--primary">Save</button></div>
      </form>
    `;
    UI.openModal(`${semester} dates`, body);
    document.getElementById('sem-dates-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const start = document.getElementById('sem-start').value;
      const end = document.getElementById('sem-end').value;
      if (new Date(end) <= new Date(start)) {
        document.getElementById('sem-dates-error').textContent = 'End date must be after the start date.';
        return;
      }
      const semesterDates = { ...settings.semesterDates, [semester]: { start, end } };
      Store.saveSettings({ semesterDates });
      UI.closeModal();
      UI.toast('Semester dates saved', 'success');
      this.renderCurrentPage();
    });
  },

  openRecurringForm(existing) {
    const settings = Store.getSettings();
    const isEdit = !!existing;
    const body = `
      <form id="recurring-form">
        <div class="form-field">
          <label for="rec-name">Name</label>
          <input type="text" id="rec-name" value="${existing ? UI.escapeHtml(existing.name) : ''}" placeholder="e.g. Phone bill" required />
        </div>
        <div class="form-grid">
          <div class="form-field">
            <label for="rec-amount">Amount (RM)</label>
            <input type="number" id="rec-amount" min="0" step="0.01" value="${existing ? existing.amount : ''}" required />
          </div>
          <div class="form-field">
            <label for="rec-frequency">Frequency</label>
            <select id="rec-frequency">
              ${['Weekly', 'Monthly', 'Semester'].map((f) => `<option value="${f}" ${existing && existing.frequency === f ? 'selected' : ''}>${f}</option>`).join('')}
            </select>
          </div>
          <div class="form-field form-field--full">
            <label for="rec-category">Category</label>
            <select id="rec-category">
              ${settings.expenseCategories.map((c) => `<option value="${UI.escapeHtml(c)}" ${existing && existing.category === c ? 'selected' : ''}>${UI.escapeHtml(c)}</option>`).join('')}
            </select>
          </div>
          <div class="form-field">
            <label for="rec-start">Start date</label>
            <input type="date" id="rec-start" value="${existing ? existing.startDate : Calc.todayMYDateString()}" required />
          </div>
          <div class="form-field">
            <label for="rec-end">End date (optional)</label>
            <input type="date" id="rec-end" value="${existing && existing.endDate ? existing.endDate : ''}" />
          </div>
        </div>
        <div class="modal-actions">
          ${isEdit ? '<button type="button" class="btn btn--danger" id="rec-delete-btn">Delete</button>' : ''}
          <button type="submit" class="btn btn--primary">${isEdit ? 'Save changes' : 'Add recurring'}</button>
        </div>
      </form>
    `;
    UI.openModal(isEdit ? 'Edit recurring expense' : 'Add recurring expense', body);

    if (isEdit) {
      document.getElementById('rec-delete-btn').addEventListener('click', () => {
        UI.confirm('Delete this recurring expense?', () => {
          Store.deleteRecurring(existing.id);
          UI.closeModal();
          UI.toast('Recurring expense deleted', 'success');
          this.renderCurrentPage();
        });
      });
    }

    document.getElementById('recurring-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const record = {
        name: document.getElementById('rec-name').value.trim(),
        amount: Number(document.getElementById('rec-amount').value) || 0,
        frequency: document.getElementById('rec-frequency').value,
        category: document.getElementById('rec-category').value,
        startDate: document.getElementById('rec-start').value,
        endDate: document.getElementById('rec-end').value || null,
      };
      if (!record.name || record.amount <= 0) return;
      if (isEdit) {
        Store.updateRecurring(existing.id, record);
        UI.toast('Recurring expense updated', 'success');
      } else {
        Store.addRecurring(record);
        UI.toast('Recurring expense added', 'success');
      }
      UI.closeModal();
      this.renderCurrentPage();
    });
  },

  // ---- data management actions ----
  exportJSON() {
    const data = Store.exportAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    this.downloadBlob(blob, `duit-kira-backup-${Calc.todayMYDateString()}.json`);
    UI.toast('Backup exported', 'success');
  },

  printSemesterSummary(semester) {
    const settings = Store.getSettings();
    const all = Store.getTransactions();
    const tx = Calc.filterBySemester(all, semester)
      .slice()
      .sort((a, b) => (a.date || '').localeCompare(b.date || ''));

    const income = Calc.totalIncome(tx);
    const expense = Calc.totalExpense(tx);
    const balance = income - expense;
    const dates = settings.semesterDates[semester];
    const catTotals = Calc.categoryTotals(tx, 'expense');
    const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);

    const container = document.getElementById('print-summary');
    if (!container) return;

    container.innerHTML = `
      <div class="print-header">
        <h1>Duit Kira — Semester Summary</h1>
        <p>${UI.escapeHtml(semester)}${dates && dates.start && dates.end ? ` · ${Calc.formatDate(dates.start)} to ${Calc.formatDate(dates.end)}` : ''}</p>
        <p class="print-meta">Generated ${new Date().toLocaleDateString('en-MY', { day: '2-digit', month: 'long', year: 'numeric', timeZone: Calc.MY_TIMEZONE })}</p>
      </div>

      <table class="print-totals">
        <tr><th>Total income</th><td>${Calc.formatMoney(income)}</td></tr>
        <tr><th>Total expenses</th><td>${Calc.formatMoney(expense)}</td></tr>
        <tr><th>Balance</th><td>${Calc.formatMoney(balance)}</td></tr>
        <tr><th>Number of transactions</th><td>${tx.length}</td></tr>
      </table>

      ${catEntries.length > 0 ? `
        <h2>Spending by category</h2>
        <table class="print-table">
          <thead><tr><th>Category</th><th>Amount</th><th>% of total</th></tr></thead>
          <tbody>
            ${catEntries.map(([cat, amt]) => `<tr><td>${UI.escapeHtml(cat)}</td><td>${Calc.formatMoney(amt)}</td><td>${expense > 0 ? Math.round((amt / expense) * 100) : 0}%</td></tr>`).join('')}
          </tbody>
        </table>
      ` : ''}

      <h2>All transactions</h2>
      ${tx.length === 0 ? '<p>No transactions recorded for this semester.</p>' : `
        <table class="print-table">
          <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead>
          <tbody>
            ${tx.map((t) => `
              <tr>
                <td>${Calc.formatDate(t.date)}</td>
                <td>${t.type === 'income' ? 'Income' : 'Expense'}</td>
                <td>${UI.escapeHtml(t.category || '')}</td>
                <td>${UI.escapeHtml(t.description || '')}</td>
                <td>${t.type === 'income' ? '+' : '-'}${Calc.formatMoney(t.amount)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    `;

    window.print();
  },

  exportCSV() {
    const all = Store.getTransactions();
    const headers = ['Date', 'Type', 'Amount', 'Category', 'Description', 'Payment Method', 'Semester', 'Notes'];
    const rows = all.map((t) => [
      t.date, t.type, t.amount, t.category, t.description || '', t.paymentMethod || '', t.semester || '', t.notes || '',
    ]);
    const csv = [headers, ...rows]
      .map((row) => row.map((cell) => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(','))
      .join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    this.downloadBlob(blob, `duit-kira-transactions-${Calc.todayMYDateString()}.csv`);
    UI.toast('Transactions exported as CSV', 'success');
  },

  downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  },

  importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        Store.importAll(data);
        UI.toast('Backup imported successfully', 'success');
        this.applyDarkMode(Store.getSettings().darkMode);
        this.populateSemesterSelect();
        this.navigate('dashboard');
      } catch (err) {
        console.error(err);
        UI.toast('Could not read that file — is it a valid backup?', 'error');
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  },
};

// Capture the browser's install prompt (Chrome/Edge/Android) so a real
// "Install app" button can be shown in Settings instead of relying on the
// browser's own menu. Safari (iOS/macOS) never fires this — those users
// get manual instructions in Settings/Guide instead.
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('install-app-btn');
  if (btn) btn.hidden = false;
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const btn = document.getElementById('install-app-btn');
  if (btn) btn.hidden = true;
});

document.addEventListener('DOMContentLoaded', () => App.init());


</script>
</body>
</html>
